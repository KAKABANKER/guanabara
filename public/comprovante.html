<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprovante - Viaje Guanabara</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: #fff;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
            padding: 40px;
        }
        .header {
            text-align: center;
            border-bottom: 2px solid #f0f2f5;
            padding-bottom: 24px;
            margin-bottom: 24px;
        }
        .header img {
            height: 50px;
            margin-bottom: 12px;
        }
        .header h1 {
            font-size: 24px;
            color: #1a2b4a;
        }
        .header .sub {
            color: #4CAF50;
            font-weight: 600;
            font-size: 16px;
        }
        .success-icon {
            width: 80px;
            height: 80px;
            background: #e8f5e9;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 40px;
            color: #4CAF50;
        }
        .ticket-info {
            background: #f8f9fc;
            border-radius: 16px;
            padding: 24px;
            margin: 20px 0;
        }
        .ticket-info .row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #e8e8e8;
        }
        .ticket-info .row:last-child {
            border-bottom: none;
        }
        .ticket-info .label {
            color: #666;
            font-weight: 500;
            font-size: 14px;
        }
        .ticket-info .value {
            font-weight: 600;
            color: #1a2b4a;
            font-size: 15px;
        }
        .ticket-info .value.price {
            color: #f5a623;
            font-size: 20px;
        }
        .ticket-info .value.code {
            font-family: monospace;
            background: #fff;
            padding: 4px 12px;
            border-radius: 6px;
            border: 1px solid #e0e0e0;
        }
        .btn-download {
            width: 100%;
            padding: 14px;
            background: #436ec9;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 16px;
        }
        .btn-download:hover {
            background: #3659b0;
        }
        .btn-home {
            width: 100%;
            padding: 14px;
            background: #e8e8e8;
            color: #333;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .btn-home:hover {
            background: #d5d5d5;
        }
        @media (max-width: 480px) {
            .container { padding: 20px; }
            .ticket-info .row { flex-direction: column; gap: 4px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="img/logo.webp" alt="Guanabara">
            <div class="success-icon">✓</div>
            <h1>Pagamento Confirmado!</h1>
            <p class="sub">Sua passagem foi emitida com sucesso</p>
        </div>

        <div class="ticket-info" id="ticketInfo">
            <div class="row">
                <span class="label">Código da Passagem</span>
                <span class="value code" id="codigoPassagem">GV20260815001</span>
            </div>
            <div class="row">
                <span class="label">Origem</span>
                <span class="value" id="origemViagem">Rio de Janeiro</span>
            </div>
            <div class="row">
                <span class="label">Destino</span>
                <span class="value" id="destinoViagem">São Paulo</span>
            </div>
            <div class="row">
                <span class="label">Passageiro</span>
                <span class="value" id="nomePassageiro">João Silva</span>
            </div>
            <div class="row">
                <span class="label">Data</span>
                <span class="value" id="dataViagem">15/08/2026</span>
            </div>
            <div class="row">
                <span class="label">Horário</span>
                <span class="value" id="horaViagem">08:00</span>
            </div>
            <div class="row">
                <span class="label">Valor Pago</span>
                <span class="value price" id="valorPago">R$ 180,00</span>
            </div>
            <div class="row">
                <span class="label">Forma de Pagamento</span>
                <span class="value" id="metodoPagamento">PIX</span>
            </div>
        </div>

        <button class="btn-download" onclick="imprimirComprovante()">🖨️ Imprimir Comprovante</button>
        <button class="btn-home" onclick="window.location.href='/'">🏠 Voltar para o Início</button>
    </div>

    <script>
        // Carregar dados do localStorage
        document.addEventListener('DOMContentLoaded', function() {
            const codigo = localStorage.getItem('ticket_codigo') || 'GV' + new Date().toISOString().slice(0,10).replace(/-/g,'') + String(Math.floor(Math.random() * 1000)).padStart(3,'0');
            document.getElementById('codigoPassagem').textContent = codigo;
            document.getElementById('origemViagem').textContent = localStorage.getItem('produto_origem') || 'Rio de Janeiro';
            document.getElementById('destinoViagem').textContent = localStorage.getItem('produto_destino') || 'São Paulo';
            document.getElementById('nomePassageiro').textContent = localStorage.getItem('cliente_nome') || 'Passageiro';
            document.getElementById('dataViagem').textContent = localStorage.getItem('produto_data') || '15/08/2026';
            document.getElementById('horaViagem').textContent = localStorage.getItem('produto_hora') || '08:00';
            document.getElementById('valorPago').textContent = 'R$ ' + (parseFloat(localStorage.getItem('produto_preco')) || 180).toFixed(2);
            document.getElementById('metodoPagamento').textContent = localStorage.getItem('metodo_pagamento') || 'PIX';
        });

        function imprimirComprovante() {
            window.print();
        }
    </script>
</body>
</html>
