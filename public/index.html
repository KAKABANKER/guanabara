<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Guanabara | Resultados da Viagem</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f5f5f5; color: #333; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

        .loading-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(255,255,255,0.9);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 20px;
        }
        .loading-overlay.active { display: flex; }
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #e8e8e8;
            border-top-color: #436ec9;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { font-size: 16px; color: #436ec9; font-weight: 600; }

        header { background: #fff; border-bottom: 1px solid #e0e0e0; padding: 15px 0; box-shadow: 0 2px 8px rgba(0,0,0,0.04); margin-bottom: 20px; }
        header .container { display: flex; align-items: center; justify-content: space-between; }
        header .logo img { height: 40px; width: auto; }

        .ticket-list { display: flex; flex-direction: column; gap: 16px; margin-top: 20px; }

        .ticket-card {
            background: #fff;
            border: 1px solid #e1e3f0;
            border-radius: 16px;
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            transition: box-shadow 0.2s;
        }
        .ticket-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.06); }

        .ticket-info { display: flex; gap: 30px; align-items: center; flex-wrap: wrap; }
        .route-info h4 { font-size: 18px; color: #1a2b4a; margin-bottom: 4px; }
        .route-info .detalhes { font-size: 13px; color: #888; }
        .ticket-times { display: flex; gap: 24px; align-items: center; }
        .time { font-size: 16px; font-weight: 700; color: #1a2b4a; }
        .duration { font-size: 12px; color: #888; }
        .ticket-price { font-size: 22px; font-weight: 700; color: #f5a623; }
        .btn-buy {
            background: #f5a623;
            color: #fff;
            border: none;
            padding: 10px 28px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-buy:hover { background: #e09515; }

        .back-link { display: inline-block; margin-top: 20px; color: #436ec9; font-weight: 600; text-decoration: none; cursor: pointer; }
        .back-link:hover { text-decoration: underline; }

        @media (max-width: 600px) {
            .ticket-card { flex-direction: column; align-items: flex-start; }
            .ticket-info { width: 100%; justify-content: space-between; }
            .btn-buy { width: 100%; text-align: center; }
        }
    </style>
</head>
<body>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">Carregando...</div>
    </div>

    <header>
        <div class="container">
            <div class="logo"><a href="/"><img src="/img/logo.webp" alt="Guanabara"></a></div>
            <div><a href="/" class="back-link" style="margin:0;">← Voltar</a></div>
        </div>
    </header>

    <div class="container">
        <h2>Viagens encontradas</h2>
        <p class="subtitle" id="subtitle" style="color:#666;font-size:14px;margin-top:4px;">Carregando...</p>
        <div class="ticket-list" id="ticketList"></div>
        <a href="/" class="back-link">← Voltar para o início</a>
    </div>

    <script>
        function showLoading() {
            document.getElementById('loadingOverlay').classList.add('active');
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').classList.remove('active');
        }

        function randomHour() {
            let h = Math.floor(Math.random() * 12) + 6;
            let m = Math.floor(Math.random() * 60);
            return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
        }

        function randomPrice(min, max) {
            return (Math.random() * (max - min) + min).toFixed(2);
        }

        function comprarPassagem(origem, destino, preco, data, hora) {
            showLoading();
            setTimeout(() => {
                window.location.href = '/?comprar=1&origem=' + encodeURIComponent(origem) + '&destino=' + encodeURIComponent(destino) + '&preco=' + preco + '&data=' + encodeURIComponent(data) + '&hora=' + encodeURIComponent(hora);
            }, 400);
        }

        function renderTickets() {
            const urlParams = new URLSearchParams(window.location.search);
            let origin = urlParams.get('origin') || 'Origem';
            let destination = urlParams.get('destination') || 'Destino';
            const date = urlParams.get('date') || new Date().toISOString().split('T')[0];
            const passengers = urlParams.get('passengers') || 1;

            // Adiciona estado se nao tiver
            if (!origin.includes('-')) origin = origin + ' - RJ';
            if (!destination.includes('-')) destination = destination + ' - SP';

            document.getElementById('subtitle').innerHTML = `Saindo de <strong>${origin}</strong> para <strong>${destination}</strong> em <strong>${date}</strong> · ${passengers} passageiro(s)`;

            let html = '';
            const empresas = ['Guanabara Express', 'Guanabara Leito', 'Guanabara Executivo', 'Guanabara Semi-Leito', 'Guanabara Cama'];
            const precoBase = parseFloat(randomPrice(60, 250));

            for (let i = 0; i < 8; i++) {
                const empresa = empresas[i % empresas.length];
                const departure = randomHour();
                const arrival = randomHour();
                const price = (precoBase + (i * 12) + Math.random() * 20).toFixed(2);
                const assentosDisponiveis = Math.floor(Math.random() * 30) + 5;

                html += `
                    <div class="ticket-card">
                        <div class="ticket-info">
                            <div class="route-info">
                                <h4>${origin} → ${destination}</h4>
                                <div class="detalhes">${empresa} · ${assentosDisponiveis} assentos disponíveis</div>
                            </div>
                            <div class="ticket-times">
                                <div><div class="time">${departure}</div><div class="duration">Saída</div></div>
                                <div style="color:#999;font-size:12px;">⏱ ${Math.floor(Math.random() * 8 + 3)}h${Math.floor(Math.random() * 50)}min</div>
                                <div><div class="time">${arrival}</div><div class="duration">Chegada</div></div>
                            </div>
                        </div>
                        <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;">
                            <div class="ticket-price">R$ ${price}</div>
                            <button class="btn-buy" onclick="comprarPassagem('${origin}', '${destination}', ${price}, '${date}', '${departure}')">Comprar</button>
                        </div>
                    </div>
                `;
            }
            document.getElementById('ticketList').innerHTML = html;
            hideLoading();

            // Registrar busca no backend
            fetch('/api/busca', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    origem: origin,
                    destino: destination,
                    data: date,
                    passageiros: parseInt(passengers) || 1
                })
            }).catch(() => {});
        }

        renderTickets();
    </script>
</body>
</html>
