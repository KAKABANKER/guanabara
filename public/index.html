<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Viaje Guanabara - Passagens de Ônibus</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gb: {
              blue: '#123481',
              'blue-hover': '#1d4499',
              yellow: '#E79F01',
              whatsapp: '#00C853',
              red: '#9A3026',
              text: '#333333',
              muted: '#888888',
              bg: '#F4F7FA',
              input: '#F5F5F5'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; color: #333333; -webkit-font-smoothing: antialiased; }
    .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #123481; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    
    /* Estilos da Poltrona */
    .seat { width: 40px; height: 40px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; transition: all 0.2s; border: 1.5px solid #22c55e; background: white; color: #15803d; font-size: 10px; }
    .seat:hover:not(.occupied) { border-color: #123481; transform: scale(1.05); background: #eef2ff; }
    .seat.selected { border-color: #E79F01; background: #E79F01; color: white; }
    .seat.occupied { background: #f3f4f6; border-color: #d1d5db; color: #9ca3af; cursor: not-allowed; }
    .seat i { font-size: 14px; margin-bottom: 2px; }

    .page-transition { animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    .suggestions-list { max-height: 200px; overflow-y: auto; }
    .suggestions-list::-webkit-scrollbar { width: 6px; }
    .suggestions-list::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Drawer fixo */
    .drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 9998; display: none; }
    .drawer-overlay.active { display: block; }
    .drawer-panel { position: fixed; top: 0; right: -100%; width: 100%; max-width: 420px; height: 100vh; background: white; z-index: 9999; transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; box-shadow: -4px 0 20px rgba(0,0,0,0.1); }
    .drawer-panel.active { right: 0; }
    .drawer-body { flex: 1; overflow-y: auto; padding: 20px; }
  </style>
</head>
<body class="bg-gb-bg min-h-screen">

  <div id="root"></div>

  <script type="text/babel">
    // ===========================
    // CONFIGURAÇÃO E FALLBACK
    // ===========================
    const API_URL = window.location.origin + '/api';
    let token = localStorage.getItem('token') || '';

    const FALLBACK_LOCATIONS = [
      { city: 'Rio de Janeiro', state: 'RJ', terminal: 'Rodoviária Novo Rio', lat: -22.9068, lng: -43.1975 },
      { city: 'São Paulo', state: 'SP', terminal: 'Terminal Tietê', lat: -23.5156, lng: -46.6204 },
      { city: 'Brasília', state: 'DF', terminal: 'Rodoviária do Plano Piloto', lat: -15.7939, lng: -47.8829 },
      { city: 'Salvador', state: 'BA', terminal: 'Rodoviária de Salvador', lat: -12.9781, lng: -38.5015 },
      { city: 'Fortaleza', state: 'CE', terminal: 'Rodoviária de Fortaleza', lat: -3.7898, lng: -38.5716 },
      { city: 'Belo Horizonte', state: 'MG', terminal: 'Rodoviária de BH', lat: -19.9167, lng: -43.9345 },
      { city: 'Curitiba', state: 'PR', terminal: 'Rodoviária de Curitiba', lat: -25.4284, lng: -49.2733 },
      { city: 'Porto Alegre', state: 'RS', terminal: 'Rodoviária de Porto Alegre', lat: -30.0346, lng: -51.2175 },
      { city: 'Goiânia', state: 'GO', terminal: 'Rodoviária de Goiânia', lat: -16.6869, lng: -49.2648 },
      { city: 'Recife', state: 'PE', terminal: 'Rodoviária de Recife', lat: -8.0543, lng: -34.8786 },
      { city: 'Belém', state: 'PA', terminal: 'Rodoviária de Belém', lat: -1.4558, lng: -48.4798 },
    ];
    let locationCache = {};

    // ===========================
    // UTILITÁRIOS
    // ===========================
    const formatDate = (dateStr) => {
      if (!dateStr) return '';
      const [y, m, d] = dateStr.split('-');
      return `${d}/${m}/${y}`;
    };

    const formatCurrency = (value) => {
      return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(value);
    };

    const apiCall = async (endpoint, method = 'GET', data = null) => {
      const headers = { 'Content-Type': 'application/json' };
      if (token) headers['Authorization'] = 'Bearer ' + token;
      const options = { method, headers };
      if (data) options.body = JSON.stringify(data);
      const response = await fetch(API_URL + endpoint, options);
      const result = await response.json();
      if (!response.ok) throw new Error(result.error || 'Erro na requisição');
      return result;
    };

    // ===========================
    // BUSCA DE CIDADES (COM TIMEOUT DE 3s)
    // ===========================
    const fetchCitiesWithTimeout = async (term) => {
      if (!term || term.length < 2) return [];
      if (locationCache[term]) return locationCache[term];

      // Cria uma promessa que rejeita após 3 segundos
      const timeoutPromise = new Promise((_, reject) => {
        setTimeout(() => reject(new Error('Tempo limite excedido')), 3000);
      });

      try {
        const response = await Promise.race([
          fetch(`https://servicodados.ibge.gov.br/api/v1/localidades/municipios?nome=${encodeURIComponent(term)}`),
          timeoutPromise
        ]);
        
        const data = await response.json();
        if (!data || data.length === 0) throw new Error('Nenhuma cidade');

        const citiesWithCoords = await Promise.all(
          data.slice(0, 8).map(async (city) => {
            try {
              const geoRes = await fetch(
                `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(city.nome + ', ' + city.microrregiao.mesorregiao.UF.sigla + ', Brasil')}&limit=1`
              );
              const geoData = await geoRes.json();
              if (geoData && geoData.length > 0) {
                return {
                  city: city.nome, state: city.microrregiao.mesorregiao.UF.sigla,
                  terminal: `Rodoviária de ${city.nome}`,
                  lat: parseFloat(geoData[0].lat), lng: parseFloat(geoData[0].lon)
                };
              }
              return null;
            } catch { return null; }
          })
        );
        const results = citiesWithCoords.filter(c => c !== null);
        locationCache[term] = results;
        return results;

      } catch (error) {
        // Fallback se demorar mais de 3s ou falhar
        console.warn('API lenta ou falhou, usando fallback');
        const fallbackResults = FALLBACK_LOCATIONS.filter(loc => 
          loc.city.toLowerCase().includes(term.toLowerCase()) || 
          loc.state.toLowerCase().includes(term.toLowerCase())
        );
        locationCache[term] = fallbackResults;
        return fallbackResults;
      }
    };

    // ===========================
    // COMPONENTES
    // ===========================

    // 1. HEADER
    const Header = ({ onBack, showBack }) => {
      return (
        <header className="sticky top-0 z-40 bg-white shadow-sm border-b border-gray-100">
          <div className="flex items-center justify-between p-4 max-w-xl mx-auto">
            <div className="flex items-center gap-3">
              {showBack && (
                <button onClick={onBack} className="text-gb-blue flex items-center gap-1 font-bold text-sm">
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 19l-7-7 7-7" />
                  </svg>
                  Voltar
                </button>
              )}
              <img src="/img/logo.webp" alt="Guanabara" className="h-10 object-contain" onError={(e) => e.target.style.display = 'none'} />
            </div>
            <div className="flex items-center gap-2">
              <div className="w-9 h-9 rounded-full bg-gb-red/10 flex items-center justify-center text-gb-red">
                <svg className="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
                  <path fillRule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clipRule="evenodd" />
                </svg>
              </div>
              <div className="text-left"><div className="text-xs font-bold text-gb-blue">Acesse sua conta</div><div className="text-[10px] text-gb-muted">ou cadastre-se</div></div>
            </div>
          </div>
        </header>
      );
    };

    // 2. HOME (BUSCA)
    const SearchFormSection = ({ onSearch }) => {
      const [origin, setOrigin] = React.useState('');
      const [destination, setDestination] = React.useState('');
      const [date, setDate] = React.useState('');
      const [passengers, setPassengers] = React.useState(1);
      const [loading, setLoading] = React.useState(false);
      const [originSuggestions, setOriginSuggestions] = React.useState([]);
      const [destSuggestions, setDestSuggestions] = React.useState([]);
      const [userLocation, setUserLocation] = React.useState(null);
      const [searchingOrigin, setSearchingOrigin] = React.useState(false);
      const [searchingDest, setSearchingDest] = React.useState(false);

      React.useEffect(() => {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            (pos) => setUserLocation({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
            () => console.log('Geolocalização negada')
          );
        }
      }, []);

      const haversineDistance = (lat1, lon1, lat2, lon2) => {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      };

      const debounce = (func, wait) => {
        let timeout;
        return (...args) => {
          clearTimeout(timeout);
          timeout = setTimeout(() => func(...args), wait);
        };
      };

      const getSuggestions = async (input) => {
        if (input.length < 2) return [];
        let results = await fetchCitiesWithTimeout(input);
        if (userLocation) {
          results = results.map(loc => ({ ...loc, distance: haversineDistance(userLocation.lat, userLocation.lng, loc.lat, loc.lng) }));
          results.sort((a, b) => a.distance - b.distance);
        }
        return results.slice(0, 6);
      };

      const debouncedOrigin = React.useCallback(debounce(async (val) => {
        if (val.length >= 2) { setSearchingOrigin(true); setOriginSuggestions(await getSuggestions(val)); setSearchingOrigin(false); }
        else setOriginSuggestions([]);
      }, 300), []);

      const debouncedDest = React.useCallback(debounce(async (val) => {
        if (val.length >= 2) { setSearchingDest(true); setDestSuggestions(await getSuggestions(val)); setSearchingDest(false); }
        else setDestSuggestions([]);
      }, 300), []);

      const selectLocation = (type, loc) => {
        const display = `${loc.city} - ${loc.state}`;
        if (type === 'origin') { setOrigin(display); setOriginSuggestions([]); }
        else { setDestination(display); setDestSuggestions([]); }
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!origin || !destination || !date) return alert('Preencha origem, destino e data.');
        setLoading(true);
        try {
          await apiCall('/busca', 'POST', { origem: origin, destino: destination, data: date, passageiros: passengers });
          onSearch({ origin, destination, date, passengers });
        } catch (err) { alert('Erro: ' + err.message); } finally { setLoading(false); }
      };

      return (
        <div className="relative max-w-xl mx-auto">
          <section className="bg-gradient-to-b from-gb-blue to-gb-blue-hover text-white pt-6 pb-16 px-5 relative overflow-hidden">
            <div className="relative z-10"><div className="flex items-start justify-between">
              <div><div className="text-6xl font-black tracking-tight leading-none mb-1">10<span className="text-4xl">%</span></div><div className="text-3xl font-black tracking-tight leading-none mb-2">OFF</div><div className="text-sm font-bold tracking-wider uppercase max-w-[200px]">EM VIAGENS DE IDA E VOLTA</div></div>
              <div className="bg-gb-yellow text-gb-blue font-black px-3 py-1.5 rounded-lg text-center shadow-md"><div className="text-[10px] uppercase tracking-wider">Exclusivo</div><div className="text-[11px] leading-tight">PARA SITE<br/>E APP!</div></div>
            </div></div>
            <div className="flex justify-center gap-1 mt-4"><span className="w-2 h-2 rounded-full bg-white"></span><span className="w-2 h-2 rounded-full bg-white/40"></span></div>
          </section>

          <section className="bg-white rounded-t-2xl shadow-xl -mt-6 relative z-20 px-5 pt-6 pb-8">
            <form onSubmit={handleSubmit} className="space-y-4">
              <div className="relative border-b border-dashed border-gray-200 pb-3">
                <label className="text-xs font-semibold text-gb-muted block mb-1">Saindo de</label>
                <div className="flex items-center gap-3">
                  <svg className="w-5 h-5 text-gb-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17.657 16.657L13.414 12.414A7.5 7.5 0 1012.414 13.414l4.243 4.243 1-1zM12 16.5a6.5 6.5 0 110-13 6.5 6.5 0 010 13z" /></svg>
                  <input type="text" placeholder="Digite a cidade" value={origin} onChange={(e) => { setOrigin(e.target.value); debouncedOrigin(e.target.value); }} className="w-full text-base outline-none placeholder:text-gb-muted bg-transparent" required />
                  {searchingOrigin && <div className="absolute right-2 top-1/2 -translate-y-1/2"><div className="spinner w-4 h-4 border-2"></div></div>}
                </div>
                {originSuggestions.length > 0 && (
                  <div className="absolute top-full left-0 right-0 bg-white shadow-lg rounded-lg mt-1 z-50 suggestions-list border border-gray-200">
                    {originSuggestions.map((loc, i) => (
                      <div key={i} onClick={() => selectLocation('origin', loc)} className="p-3 hover:bg-gray-50 cursor-pointer border-b border-gray-100 last:border-0">
                        <div className="font-medium">{loc.city} - {loc.state}</div>
                        <div className="text-xs text-gb-muted">{loc.terminal}</div>
                        {loc.distance && <div className="text-xs text-gb-blue mt-1">{Math.round(loc.distance)} km de você</div>}
                      </div>
                    ))}
                  </div>
                )}
              </div>

              <div className="relative flex justify-end -my-3 z-10 pr-2">
                <button type="button" onClick={() => { setOrigin(destination); setDestination(origin); }} className="bg-gb-blue text-white p-2.5 rounded-lg shadow-md hover:bg-gb-blue-hover transition">
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4" /></svg>
                </button>
              </div>

              <div className="relative border-b border-dashed border-gray-200 pb-3">
                <label className="text-xs font-semibold text-gb-muted block mb-1">Indo para</label>
                <div className="flex items-center gap-3">
                  <svg className="w-5 h-5 text-gb-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" /></svg>
                  <input type="text" placeholder="Digite a cidade" value={destination} onChange={(e) => { setDestination(e.target.value); debouncedDest(e.target.value); }} className="w-full text-base outline-none placeholder:text-gb-muted bg-transparent" required />
                  {searchingDest && <div className="absolute right-2 top-1/2 -translate-y-1/2"><div className="spinner w-4 h-4 border-2"></div></div>}
                </div>
                {destSuggestions.length > 0 && (
                  <div className="absolute top-full left-0 right-0 bg-white shadow-lg rounded-lg mt-1 z-50 suggestions-list border border-gray-200">
                    {destSuggestions.map((loc, i) => (
                      <div key={i} onClick={() => selectLocation('destination', loc)} className="p-3 hover:bg-gray-50 cursor-pointer border-b border-gray-100 last:border-0">
                        <div className="font-medium">{loc.city} - {loc.state}</div>
                        <div className="text-xs text-gb-muted">{loc.terminal}</div>
                        {loc.distance && <div className="text-xs text-gb-blue mt-1">{Math.round(loc.distance)} km de você</div>}
                      </div>
                    ))}
                  </div>
                )}
              </div>

              <div className="grid grid-cols-2 gap-4 border-b border-dashed border-gray-200 pb-3 pt-2">
                <div><label className="text-xs font-semibold text-gb-muted block mb-1">Ida</label><input type="date" value={date} onChange={e => setDate(e.target.value)} className="w-full text-sm outline-none bg-transparent" required /></div>
                <div><label className="text-xs font-semibold text-gb-muted block mb-1">Volta (Opcional)</label><input type="date" className="w-full text-sm outline-none bg-transparent" /></div>
              </div>
              <div className="border-b border-dashed border-gray-200 pb-3 pt-2">
                <label className="text-xs font-semibold text-gb-muted block mb-1">Passageiros</label>
                <div className="flex items-center gap-3">
                  <svg className="w-5 h-5 text-gb-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" /></svg>
                  <input type="number" min="1" value={passengers} onChange={e => setPassengers(parseInt(e.target.value))} className="w-full text-base font-semibold outline-none bg-transparent" />
                </div>
              </div>
              <div className="pt-3">
                <button type="submit" disabled={loading} className="w-full bg-gb-blue hover:bg-gb-blue-hover text-white font-bold py-4 rounded-xl text-lg uppercase tracking-wider transition shadow-md disabled:opacity-50">
                  {loading ? 'BUSCANDO...' : 'BUSCAR VIAGEM'}
                </button>
              </div>
            </form>
          </section>
        </div>
      );
    };

    // 3. TELA DE RESULTADOS (TICKETS) - Design do arquivo que você enviou
    const TicketsScreen = ({ searchData, onSelectTicket }) => {
      const [tickets, setTickets] = React.useState([]);
      const [loading, setLoading] = React.useState(true);

      React.useEffect(() => {
        const fetchTickets = async () => {
          setLoading(true);
          // Simula busca de passagens
          const mockTickets = [
            { id: 1, origem: searchData.origin, destino: searchData.destination, data: searchData.date, passageiros: searchData.passengers, valor: 179.99, valorOriginal: 258.64, horario: '22:46', chegada: '07:35 (+1)', duracao: '8:49', empresa: 'GUANABARA', sub: 'RÁPIDOFEDERAL', tipo: 'Executivo', terminal: 'Rodoviária de Brasília - Asa-Sul', vivaPontos: 450, recommended: true },
            { id: 2, origem: searchData.origin, destino: searchData.destination, data: searchData.date, passageiros: searchData.passengers, valor: 219.99, valorOriginal: 308.64, horario: '22:46', chegada: '07:35', duracao: '8:49', empresa: 'GUANABARA', sub: 'RÁPIDOFEDERAL', tipo: 'Leito', terminal: 'Rodoviária de Brasília - Asa-Sul', vivaPontos: 550, recommended: false },
          ];
          setTickets(mockTickets);
          setLoading(false);
        };
        fetchTickets();
      }, [searchData]);

      if (loading) return <div className="text-center py-10"><div className="spinner mx-auto"></div></div>;

      return (
        <div className="max-w-xl mx-auto px-4 py-4 page-transition">
          <div className="section-title text-xl font-bold text-gb-blue flex items-center gap-2 mb-4">Nossas sugestões <span>✨</span></div>
          
          {tickets.map((ticket) => (
            <div key={ticket.id} className={`bg-white rounded-xl border mb-4 shadow-sm overflow-hidden ${ticket.recommended ? 'border-2 border-gb-blue' : 'border-gray-200'}`}>
              {ticket.recommended && (
                <div className="bg-gb-blue text-white text-xs font-bold text-center py-1 flex items-center justify-center gap-2">
                  <i className="fas fa-gem"></i> A gente recomenda
                </div>
              )}
              <div className="p-5 flex flex-col md:flex-row items-center justify-between gap-4">
                <div className="flex flex-col min-w-[140px]">
                  <div className="font-extrabold text-red-700 text-lg flex items-center gap-2"><i className="fas fa-bus"></i> {ticket.empresa}</div>
                  <div className="text-[10px] text-yellow-600 font-bold uppercase tracking-wider">{ticket.sub}</div>
                  <div className="bg-gray-100 rounded-full px-3 py-1 text-xs font-bold text-gray-700 inline-block mt-1 w-fit">{ticket.tipo} <i className="fas fa-bus-alt ml-1"></i></div>
                </div>

                <div className="flex items-center gap-4 flex-1 justify-center">
                  <div className="text-center"><div className="text-xl font-bold text-gray-900">{ticket.horario}</div><div className="text-[10px] font-bold text-gray-500 uppercase">{ticket.origem}</div></div>
                  <div className="text-xs text-gray-500 flex items-center gap-2"><span className="font-medium">{ticket.duracao}</span> <i className="far fa-clock"></i></div>
                  <div className="text-center"><div className="text-xl font-bold text-gray-900">{ticket.chegada}</div><div className="text-[10px] font-bold text-gray-500 uppercase">{ticket.destino}</div></div>
                </div>

                <div className="text-right">
                  <div className="text-xs text-gray-400 line-through">{formatCurrency(ticket.valorOriginal)}</div>
                  <div className="text-2xl font-black text-gb-blue">{formatCurrency(ticket.valor)}</div>
                </div>
              </div>

              <div className="border-t border-gray-100 p-3 flex flex-col sm:flex-row justify-between items-center gap-3 bg-gray-50/50">
                <div className="flex items-center gap-6 text-xs text-gray-600">
                  <span className="flex items-center gap-1 text-gb-blue"><i className="fas fa-map-marker-alt"></i> {ticket.terminal}</span>
                  <button className="text-gb-blue font-bold hover:underline flex items-center gap-1">Mais detalhes <i className="fas fa-caret-down"></i></button>
                </div>
                <div className="flex items-center gap-3">
                  <div className="border border-pink-400 text-pink-600 text-xs font-bold px-3 py-1 rounded-full flex items-center gap-1 bg-white">+ {ticket.vivaPontos} <i className="fas fa-gift"></i></div>
                  <button onClick={() => onSelectTicket(ticket)} className="bg-gb-blue text-white font-bold px-5 py-2 rounded-lg hover:bg-gb-blue-hover transition">Escolher assento</button>
                </div>
              </div>
            </div>
          ))}
        </div>
      );
    };

    // 4. DRAWER DE ASSENTOS (Design aprimorado)
    const SeatDrawer = ({ ticket, onClose, onConfirm }) => {
      const [selectedSeat, setSelectedSeat] = React.useState(null);
      const [showUpgrade, setShowUpgrade] = React.useState(true);
      const [upgraded, setUpgraded] = React.useState(false);
      
      const occupiedSeats = [3, 7, 12, 15, 18, 22, 28, 33, 37];
      const totalSeats = 44;

      const handleSeatClick = (num) => {
        if (occupiedSeats.includes(num)) return;
        setSelectedSeat(num);
      };

      const handleConfirm = () => {
        if (!selectedSeat) return;
        let finalPrice = ticket.valor;
        if (upgraded) finalPrice += 40;
        onConfirm({ ...ticket, assento: selectedSeat, precoFinal: finalPrice, upgrade: upgraded });
      };

      const renderSeats = () => {
        let seats = [];
        for (let i = 1; i <= totalSeats; i++) {
          const isOccupied = occupiedSeats.includes(i);
          const isSelected = selectedSeat === i;
          seats.push(
            <div key={i} className={`seat ${isOccupied ? 'occupied' : 'available'} ${isSelected ? 'selected' : ''}`} onClick={() => handleSeatClick(i)}>
              <i className={`fas fa-couch ${isOccupied ? 'text-gray-400' : 'text-green-500'}`}></i>
              <span>{i}</span>
            </div>
          );
        }
        return seats;
      };

      return (
        <>
          <div className={`drawer-overlay ${ticket ? 'active' : ''}`} onClick={onClose}></div>
          <div className={`drawer-panel ${ticket ? 'active' : ''}`}>
            <div className="p-4 border-b border-gray-200 flex justify-between items-center bg-white">
              <div>
                <div className="text-sm text-gb-blue font-bold">Indo para</div>
                <div className="text-lg font-extrabold text-gray-900">{ticket?.destino}</div>
              </div>
              <button onClick={onClose} className="text-gray-500 text-2xl hover:text-gray-800"><i className="fas fa-times"></i></button>
            </div>

            <div className="drawer-body bg-gray-50">
              {showUpgrade ? (
                <div className="bg-white p-4 rounded-xl shadow-sm mb-4">
                  <div className="flex justify-between items-center text-xs text-gray-700 border-b border-gray-100 pb-3 mb-4">
                    <div><div className="font-bold">{ticket?.origem}</div><div className="text-gray-500">Partida às {ticket?.horario}</div></div>
                    <div className="h-0.5 flex-1 bg-gray-300 mx-3 relative"><div className="w-1.5 h-1.5 bg-gray-400 rounded-full absolute -top-0.5 left-0"></div><div className="w-1.5 h-1.5 bg-gray-400 rounded-full absolute -top-0.5 right-0"></div></div>
                    <div className="text-right"><div className="font-bold">{ticket?.destino}</div><div className="text-gray-500">Chegada às {ticket?.chegada}</div></div>
                  </div>
                  <div className="font-bold text-gb-blue text-sm mb-3">Confira como é o leito</div>
                  <div className="flex gap-3 overflow-x-auto pb-2 hide-scrollbar">
                    <div className="min-w-[180px] bg-gb-blue rounded-xl overflow-hidden text-white">
                      <img src="https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?auto=format&fit=crop&w=600&q=80" className="h-28 w-full object-cover" />
                      <div className="p-2 text-xs font-bold flex items-center gap-2"><i className="fas fa-couch"></i> 140° de reclinação</div>
                    </div>
                  </div>
                  <button onClick={() => { setUpgraded(true); setShowUpgrade(false); }} className="w-full bg-gb-blue text-white font-bold py-3 rounded-lg mt-2">Realizar upgrade (+ R$ 40,00)</button>
                  <button onClick={() => { setUpgraded(false); setShowUpgrade(false); }} className="w-full bg-white text-gb-blue border-2 border-gb-blue font-bold py-3 rounded-lg mt-2">Manter classe atual</button>
                </div>
              ) : (
                <div className="bg-white p-4 rounded-xl shadow-sm">
                  <div className="border-2 border-gb-blue rounded-2xl p-4 max-w-xs mx-auto bg-white relative">
                    <div className="text-center text-gray-400 text-3xl mb-4"><i className="fas fa-steering-wheel"></i></div>
                    <div className="grid grid-cols-4 gap-2">
                      {renderSeats()}
                    </div>
                  </div>
                  <div className="flex justify-around mt-4 text-xs font-medium text-gray-600 border-t border-gray-100 pt-4">
                    <div className="flex flex-col items-center gap-1"><div className="w-4 h-4 border border-green-500 rounded bg-white"></div> Disponível</div>
                    <div className="flex flex-col items-center gap-1"><div className="w-4 h-4 bg-gray-200 border border-gray-300 rounded"></div> Ocupado</div>
                    <div className="flex flex-col items-center gap-1"><div className="w-4 h-4 bg-gb-yellow border border-gb-yellow rounded"></div> Selecionado</div>
                  </div>
                </div>
              )}
            </div>

            <div className={`p-4 border-t border-gray-200 bg-white flex justify-between items-center ${showUpgrade ? 'hidden' : 'flex'}`}>
              <div>
                <div className="text-sm font-bold text-gb-blue">{selectedSeat ? '1 de 1 assento' : '0 de 1 assento'}</div>
                <div className="text-xl font-black text-gb-blue">{formatCurrency(ticket?.valor + (upgraded ? 40 : 0))}</div>
              </div>
              <button onClick={handleConfirm} disabled={!selectedSeat} className={`font-bold py-3 px-6 rounded-lg transition ${selectedSeat ? 'bg-gb-blue text-white cursor-pointer hover:bg-gb-blue-hover' : 'bg-gray-300 text-white cursor-not-allowed'}`}>
                Confirmar
              </button>
            </div>
          </div>
        </>
      );
    };

    // 5. TELA DE DADOS DO PASSAGEIRO (Nova tela antes do checkout)
    const PassengerDataScreen = ({ ticket, onNext }) => {
      const [nome, setNome] = React.useState('');
      const [cpf, setCpf] = React.useState('');
      const [telefone, setTelefone] = React.useState('');
      const [email, setEmail] = React.useState('');

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!nome || !cpf || !telefone || !email) return alert('Preencha todos os dados.');
        localStorage.setItem('cliente_nome', nome);
        localStorage.setItem('cliente_cpf', cpf);
        localStorage.setItem('cliente_telefone', telefone);
        localStorage.setItem('cliente_email', email);
        onNext();
      };

      return (
        <div className="max-w-xl mx-auto px-5 py-6 page-transition">
          <h2 className="text-xl font-bold mb-4 text-gb-blue">Dados do Passageiro</h2>
          <div className="bg-white p-6 rounded-xl shadow border border-gray-100">
            <form onSubmit={handleSubmit} className="space-y-4">
              <div><label className="block text-sm font-semibold text-gb-muted mb-1">Nome completo</label><input type="text" value={nome} onChange={e => setNome(e.target.value)} className="w-full p-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-gb-blue outline-none" required /></div>
              <div><label className="block text-sm font-semibold text-gb-muted mb-1">CPF</label><input type="text" value={cpf} onChange={e => setCpf(e.target.value)} className="w-full p-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-gb-blue outline-none" required /></div>
              <div><label className="block text-sm font-semibold text-gb-muted mb-1">Telefone / WhatsApp</label><input type="text" value={telefone} onChange={e => setTelefone(e.target.value)} className="w-full p-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-gb-blue outline-none" required /></div>
              <div><label className="block text-sm font-semibold text-gb-muted mb-1">E-mail</label><input type="email" value={email} onChange={e => setEmail(e.target.value)} className="w-full p-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-gb-blue outline-none" required /></div>
              <button type="submit" className="w-full bg-gb-blue hover:bg-gb-blue-hover text-white font-bold py-3 rounded-lg text-lg transition">Ir para o pagamento</button>
            </form>
          </div>
        </div>
      );
    };

    // 6. TELA DE CHECKOUT (Pagamento)
    const CheckoutScreen = ({ ticket, onPaymentComplete }) => {
      const [metodo, setMetodo] = React.useState('pix');
      const [loading, setLoading] = React.useState(false);
      const [pixCode, setPixCode] = React.useState('');
      const [qrInstance, setQrInstance] = React.useState(null);
      const [paymentStatus, setPaymentStatus] = React.useState('pending');

      const nome = localStorage.getItem('cliente_nome') || '';
      const cpf = localStorage.getItem('cliente_cpf') || '';
      const telefone = localStorage.getItem('cliente_telefone') || '';

      const handlePayment = async () => {
        setLoading(true);
        try {
          const clienteRes = await apiCall('/cliente', 'POST', { nome, cpf, telefone, email: localStorage.getItem('cliente_email'), qtdCriancas: 0 });
          const clienteId = clienteRes.cliente_id;

          const codigo = 'GV' + new Date().toISOString().slice(0,10).replace(/-/g,'') + String(Math.floor(Math.random()*1000)).padStart(3,'0');
          await apiCall('/compra', 'POST', {
            origem: ticket.origem, destino: ticket.destino, passageiro: nome, data: ticket.data, valor: ticket.precoFinal, metodoPagamento: metodo === 'pix' ? 'PIX' : 'Cartão', codigo: codigo
          });

          localStorage.setItem('ticket_codigo', codigo);
          onPaymentComplete(codigo);
        } catch (err) {
          alert('Erro ao finalizar compra: ' + err.message);
        } finally {
          setLoading(false);
        }
      };

      const gerarPix = async () => {
        if (pixCode) return;
        try {
          const res = await apiCall('/create-payment', 'POST', { amount: ticket.precoFinal, customer_name: nome, customer_cpf: cpf, customer_phone: telefone });
          if (res.success) {
            setPixCode(res.payment.pix_code);
            setTimeout(() => setPaymentStatus('paid'), 4000);
          } else alert('Erro ao gerar PIX: ' + res.error);
        } catch (err) { alert('Erro ao gerar PIX'); }
      };

      React.useEffect(() => {
        if (pixCode && !qrInstance) {
          const qr = new QRCode(document.getElementById('qrcode'), { text: pixCode, width: 180, height: 180 });
          setQrInstance(qr);
        }
      }, [pixCode]);

      return (
        <div className="max-w-xl mx-auto px-5 py-4 page-transition">
          <h2 className="text-xl font-bold mb-4 text-gb-blue">Finalizar Compra</h2>
          <div className="bg-white p-4 rounded-xl shadow mb-4 border border-gray-100">
            <div className="grid grid-cols-2 gap-2 text-sm">
              <div><span className="font-bold text-gray-500">Origem:</span> {ticket.origem}</div>
              <div><span className="font-bold text-gray-500">Destino:</span> {ticket.destino}</div>
              <div><span className="font-bold text-gray-500">Assento:</span> {ticket.assento}</div>
              <div><span className="font-bold text-gray-500">Total:</span> {formatCurrency(ticket.precoFinal)}</div>
            </div>
          </div>

          <div className="flex gap-2 mb-4">
            <button onClick={() => setMetodo('pix')} className={`flex-1 py-2 rounded-lg font-bold ${metodo === 'pix' ? 'bg-gb-blue text-white' : 'bg-gray-100'}`}>PIX</button>
            <button onClick={() => setMetodo('cartao')} className={`flex-1 py-2 rounded-lg font-bold ${metodo === 'cartao' ? 'bg-gb-blue text-white' : 'bg-gray-100'}`}>Cartão</button>
          </div>

          {metodo === 'pix' && (
            <div className="bg-white p-4 rounded-lg shadow border border-gray-100 text-center">
              {!pixCode ? (
                <button onClick={gerarPix} className="bg-gb-yellow text-white font-bold py-2 px-6 rounded-lg">Gerar PIX</button>
              ) : (
                <>
                  <div id="qrcode" className="flex justify-center mb-2"></div>
                  <div className="text-xs text-gray-500 mb-2">Escaneie o QR Code</div>
                  {paymentStatus === 'paid' ? <div className="text-green-600 font-bold">✅ Pagamento confirmado!</div> : <div className="text-gb-yellow font-bold">⏳ Aguardando...</div>}
                </>
              )}
            </div>
          )}

          <button onClick={handlePayment} disabled={loading || (metodo === 'pix' && paymentStatus !== 'paid')} className="w-full mt-4 bg-gb-blue hover:bg-gb-blue-hover text-white font-bold py-3 rounded-xl text-lg uppercase tracking-wider transition disabled:opacity-50">
            {loading ? 'PROCESSANDO...' : 'CONFIRMAR PAGAMENTO'}
          </button>
        </div>
      );
    };

    // 7. COMPROVANTE
    const ReceiptScreen = ({ codigo }) => {
      const nome = localStorage.getItem('cliente_nome') || 'Passageiro';
      return (
        <div className="max-w-xl mx-auto px-5 py-10 text-center page-transition">
          <div className="bg-green-100 text-green-800 p-4 rounded-full inline-flex mb-4">
            <svg className="w-16 h-16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" /></svg>
          </div>
          <h2 className="text-2xl font-bold text-green-700 mb-2">Pagamento Confirmado!</h2>
          <p className="text-gray-500 mb-6">Sua passagem foi emitida com sucesso.</p>
          <div className="bg-white p-6 rounded-xl shadow text-left border border-gray-100">
            <div className="flex justify-between py-2 border-b border-gray-100"><span className="font-bold">Código:</span><span className="font-mono">{codigo}</span></div>
            <div className="flex justify-between py-2 border-b border-gray-100"><span className="font-bold">Passageiro:</span><span>{nome}</span></div>
            <div className="flex justify-between py-2"><span className="font-bold">Status:</span><span className="text-green-600 font-bold">CONFIRMADO</span></div>
          </div>
          <button onClick={() => window.location.reload()} className="mt-6 bg-gb-blue text-white font-bold py-3 px-8 rounded-lg hover:bg-gb-blue-hover transition">Nova compra</button>
        </div>
      );
    };

    // 8. BOTTOM NAV
    const BottomNav = ({ onNavigate, currentScreen }) => {
      const items = [
        { id: 'home', label: 'Busca', icon: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /> },
        { id: 'services', label: 'Serviços', icon: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" /> },
        { id: 'account', label: 'Conta', icon: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /> },
        { id: 'help', label: 'Ajuda', icon: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" /> }
      ];
      return (
        <nav className="fixed bottom-0 left-0 right-0 z-40 bg-white border-t border-gray-200 shadow-lg">
          <div className="flex justify-around items-center max-w-xl mx-auto py-2">
            {items.map((item) => (
              <button key={item.id} onClick={() => onNavigate(item.id)} className={`flex flex-col items-center gap-0.5 py-1 px-3 ${currentScreen === item.id ? 'text-gb-blue' : 'text-gb-muted'}`}>
                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">{item.icon}</svg>
                <span className={`text-[11px] ${currentScreen === item.id ? 'font-bold' : 'font-medium'}`}>{item.label}</span>
              </button>
            ))}
          </div>
        </nav>
      );
    };

    // 9. TELAS ESTÁTICAS
    const ServicesScreen = () => (
      <div className="max-w-xl mx-auto px-5 py-4"><h2 className="text-xl font-bold mb-4 text-gb-blue">Nossos Serviços</h2><div className="bg-white p-4 rounded-xl shadow border border-gray-100"><p className="text-gray-500">Wi-Fi a bordo, Ar-condicionado, Banheiro, Poltronas reclináveis.</p></div></div>
    );
    const AccountScreen = () => (
      <div className="max-w-xl mx-auto px-5 py-4"><h2 className="text-xl font-bold mb-4 text-gb-blue">Minha Conta</h2><div className="bg-white p-4 rounded-xl shadow border border-gray-100"><input type="email" placeholder="Email" className="w-full p-2 border rounded mb-2"/><input type="password" placeholder="Senha" className="w-full p-2 border rounded mb-2"/><button className="w-full bg-gb-blue text-white font-bold py-2 rounded">Entrar</button></div></div>
    );
    const HelpScreen = () => (
      <div className="max-w-xl mx-auto px-5 py-4"><h2 className="text-xl font-bold mb-4 text-gb-blue">Central de Ajuda</h2><div className="bg-white p-4 rounded-xl shadow border border-gray-100"><p className="text-gray-500">0800 728 1992</p></div></div>
    );

    // 10. WHATSAPP FLOATING BUTTON
    const WhatsappFAB = () => (
      <a href="https://wa.me/" target="_blank" className="fixed bottom-20 right-4 z-30 bg-gb-whatsapp text-white p-3.5 rounded-full shadow-2xl hover:scale-105 transition">
        <svg className="w-8 h-8" fill="currentColor" viewBox="0 0 24 24"><path d="M12.004 2c-5.518 0-9.998 4.478-9.998 9.996 0 1.932.548 3.731 1.492 5.276l-1.51 5.485c-.086.312.2.6.511.512l5.485-1.51c1.545.944 3.344 1.492 5.276 1.492 5.518 0 10-4.478 10-9.996 0-5.518-4.482-9.996-10-9.996zm6.398 14.15c-.267.75-1.298 1.455-2.071 1.631-.564.128-1.293.18-2.046-.089-2.047-.732-3.805-1.95-5.35-3.52-1.57-1.57-2.656-3.328-3.323-5.322-.267-.751-.237-1.481-.065-2.047.161-.726.963-1.803 1.621-2.07.2-.086.43-.129.645-.129.231.002.31.026.43.026.173.011.391.076.541.25.132.148.43.518.571.742.23.364.381.678.131.961-.131.282-.198.411-.314.513-.114.116-.242.222-.323.33-.129.172-.036.377.103.57.541.761 1.258 1.455 1.95 2.148.693.693 1.387 1.411 2.148 1.95.193.14.398.232.57.103.109-.082.213-.209.33-.323.102-.116.231-.183.513-.314.283-.13.597-.101.961.131.224.141.594.439.742.571.173.15.239.367.25.541.001.121-.01.2-.01.2.001.215-.043.444-.129.644z"/></svg>
      </a>
    );

    // ===========================
    // APP PRINCIPAL
    // ===========================
    const App = () => {
      const [screen, setScreen] = React.useState('home');
      const [searchData, setSearchData] = React.useState(null);
      const [selectedTicket, setSelectedTicket] = React.useState(null);
      const [receiptCode, setReceiptCode] = React.useState(null);
      const [loadingFake, setLoadingFake] = React.useState(false);

      const handleSearch = (data) => { setSearchData(data); setScreen('tickets'); };
      
      const handleSelectTicket = (ticket) => { setSelectedTicket(ticket); };

      const handleSeatConfirm = (ticketWithSeat) => {
        setSelectedTicket(ticketWithSeat);
        setScreen('passenger');
      };

      const handlePassengerNext = () => {
        setLoadingFake(true);
        setTimeout(() => {
          setLoadingFake(false);
          setScreen('checkout');
        }, 1500); // Fake loading de 1.5s
      };

      const handlePaymentComplete = (codigo) => { setReceiptCode(codigo); setScreen('receipt'); };

      const handleNavigate = (page) => {
        if (page === 'home') { setScreen('home'); setSearchData(null); setSelectedTicket(null); setReceiptCode(null); } 
        else setScreen(page);
      };

      return (
        <div className="pb-24">
          <Header onBack={() => setScreen('home')} showBack={screen !== 'home' && screen !== 'services' && screen !== 'account' && screen !== 'help'} />
          <main>
            {loadingFake && <div className="fixed inset-0 z-50 bg-white/80 flex items-center justify-center"><div className="text-center"><div className="spinner mx-auto"></div><div className="mt-4 text-gb-blue font-bold">Preparando seu pagamento...</div></div></div>}
            
            {screen === 'home' && <><SearchFormSection onSearch={handleSearch} /></>}
            {screen === 'tickets' && searchData && <TicketsScreen searchData={searchData} onSelectTicket={handleSelectTicket} />}
            {screen === 'passenger' && selectedTicket && <PassengerDataScreen ticket={selectedTicket} onNext={handlePassengerNext} />}
            {screen === 'checkout' && selectedTicket && <CheckoutScreen ticket={selectedTicket} onPaymentComplete={handlePaymentComplete} />}
            {screen === 'receipt' && receiptCode && <ReceiptScreen codigo={receiptCode} />}
            {screen === 'services' && <ServicesScreen />}
            {screen === 'account' && <AccountScreen />}
            {screen === 'help' && <HelpScreen />}
            
            <SeatDrawer ticket={selectedTicket} onClose={() => setSelectedTicket(null)} onConfirm={handleSeatConfirm} />
          </main>
          <WhatsappFAB />
          <BottomNav onNavigate={handleNavigate} currentScreen={screen} />
        </div>
      );
    };

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
