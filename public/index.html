<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Viaje Guanabara - Passagens de Ônibus</title>
    
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gb: {
                            blue: '#123481',
                            'blue-hover': '#1d4499',
                            yellow: '#E79F01',
                            whatsapp: '#00C853',
                            red: '#9A3026',
                            text: '#333333',
                            muted: '#888888',
                            bg: '#F4F7FA',
                            input: '#F5F5F5'
                        }
                    }
                }
            }
        }
    </script>

    <!-- Fontes e Libs -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; background: #F4F7FA; color: #333; -webkit-font-smoothing: antialiased; }
        
        /* Spinner */
        .spinner { width: 30px; height: 30px; border: 3px solid #e5e7eb; border-top: 3px solid #123481; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Assentos (Mobile Otimizado) */
        .seat-wrapper { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
        .seat { width: 38px; height: 38px; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 700; font-size: 10px; cursor: pointer; transition: all 0.15s; border: 2px solid #d1d5db; background: #fff; color: #374151; }
        .seat.available { border-color: #22c55e; color: #15803d; }
        .seat.available:active { transform: scale(0.95); }
        .seat.selected { border-color: #E79F01; background: #E79F01; color: white; transform: scale(1.05); }
        .seat.occupied { background: #f3f4f6; border-color: #e5e7eb; color: #9ca3af; cursor: not-allowed; }
        .seat i { font-size: 14px; margin-bottom: 1px; }

        /* Animações */
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .slide-up { animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        /* Drawer */
        .drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 998; display: none; }
        .drawer-overlay.active { display: block; }
        .drawer-panel { position: fixed; bottom: -100%; left: 0; right: 0; max-height: 95vh; background: white; z-index: 999; border-radius: 20px 20px 0 0; transition: bottom 0.3s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; box-shadow: 0 -10px 30px rgba(0,0,0,0.1); overflow: hidden; }
        .drawer-panel.active { bottom: 0; }

        /* Scrollbar Suave */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }

        /* Ajustes Mobile */
        @media (max-width: 480px) {
            .seat { width: 32px; height: 32px; font-size: 9px; }
            .seat i { font-size: 12px; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // ===========================
        // CONFIGURAÇÃO E FALLBACK (Capitais)
        // ===========================
        const API_URL = window.location.origin + '/api';
        
        const FALLBACK_LOCATIONS = [
            { city: 'Rio de Janeiro', state: 'RJ', terminal: 'Rodoviária Novo Rio', lat: -22.9068, lng: -43.1975 },
            { city: 'São Paulo', state: 'SP', terminal: 'Terminal Tietê', lat: -23.5156, lng: -46.6204 },
            { city: 'Brasília', state: 'DF', terminal: 'Rodoviária do Plano Piloto', lat: -15.7939, lng: -47.8829 },
            { city: 'Salvador', state: 'BA', terminal: 'Rodoviária de Salvador', lat: -12.9781, lng: -38.5015 },
            { city: 'Fortaleza', state: 'CE', terminal: 'Rodoviária de Fortaleza', lat: -3.7898, lng: -38.5716 },
            { city: 'Belo Horizonte', state: 'MG', terminal: 'Rodoviária de BH', lat: -19.9167, lng: -43.9345 },
            { city: 'Curitiba', state: 'PR', terminal: 'Rodoviária de Curitiba', lat: -25.4284, lng: -49.2733 },
            { city: 'Porto Alegre', state: 'RS', terminal: 'Rodoviária de Porto Alegre', lat: -30.0346, lng: -51.2175 },
            { city: 'Goiânia', state: 'GO', terminal: 'Rodoviária de Goiânia', lat: -16.6869, lng: -49.2648 },
            { city: 'Recife', state: 'PE', terminal: 'Rodoviária de Recife', lat: -8.0543, lng: -34.8786 },
            { city: 'Belém', state: 'PA', terminal: 'Rodoviária de Belém', lat: -1.4558, lng: -48.4798 },
        ];

        // Cache de cidades
        let cityCache = {};

        // ===========================
        // UTILITÁRIOS
        // ===========================
        const formatCurrency = (value) => {
            return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(value);
        };

        const formatDate = (str) => {
            if (!str) return '';
            const [y, m, d] = str.split('-');
            return `${d}/${m}/${y}`;
        };

        const apiCall = async (endpoint, method = 'GET', data = null) => {
            const headers = { 'Content-Type': 'application/json' };
            const token = localStorage.getItem('token');
            if (token) headers['Authorization'] = 'Bearer ' + token;
            const options = { method, headers };
            if (data) options.body = JSON.stringify(data);
            const res = await fetch(API_URL + endpoint, options);
            const json = await res.json();
            if (!res.ok) throw new Error(json.error || 'Erro na requisição');
            return json;
        };

        // ===========================
        // BUSCA DE CIDADES (2s de timeout)
        // ===========================
        const searchCities = async (term) => {
            if (term.length < 2) return [];
            if (cityCache[term]) return cityCache[term];

            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 2000);

            try {
                const res = await fetch(`https://servicodados.ibge.gov.br/api/v1/localidades/municipios?nome=${encodeURIComponent(term)}`, { signal: controller.signal });
                clearTimeout(timeout);
                const data = await res.json();
                
                if (!data || data.length === 0) throw new Error('Vazio');

                const results = await Promise.all(
                    data.slice(0, 6).map(async (c) => {
                        try {
                            const geo = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(c.nome + ', ' + c.microrregiao.mesorregiao.UF.sigla + ', Brasil')}&limit=1`);
                            const geoData = await geo.json();
                            if (geoData && geoData[0]) {
                                return {
                                    city: c.nome,
                                    state: c.microrregiao.mesorregiao.UF.sigla,
                                    terminal: `Rodoviária de ${c.nome}`,
                                    lat: parseFloat(geoData[0].lat),
                                    lng: parseFloat(geoData[0].lon)
                                };
                            }
                            return null;
                        } catch { return null; }
                    })
                );
                const valid = results.filter(r => r !== null);
                cityCache[term] = valid;
                return valid;

            } catch (error) {
                // Fallback caso demore ou falhe
                const fallback = FALLBACK_LOCATIONS.filter(l => 
                    l.city.toLowerCase().includes(term.toLowerCase()) || 
                    l.state.toLowerCase().includes(term.toLowerCase())
                );
                cityCache[term] = fallback;
                return fallback;
            }
        };

        // ===========================
        // COMPONENTES
        // ===========================

        // 1. HEADER
        const Header = ({ showBack, onBack }) => (
            <header className="sticky top-0 z-30 bg-white shadow-sm border-b border-gray-100 px-4 py-3 flex justify-between items-center">
                <div className="flex items-center gap-3">
                    {showBack ? (
                        <button onClick={onBack} className="text-gb-blue text-sm font-bold flex items-center gap-1">
                            <i className="fas fa-arrow-left"></i> Voltar
                        </button>
                    ) : (
                        <img src="/img/logo.webp" alt="Guanabara" className="h-8 object-contain" onError={(e) => e.target.style.display='none'} />
                    )}
                </div>
                <div className="flex items-center gap-2">
                    <div className="w-8 h-8 bg-gb-red/10 rounded-full flex items-center justify-center text-gb-red text-sm">
                        <i className="fas fa-user"></i>
                    </div>
                    <div className="text-right hidden sm:block">
                        <div className="text-xs font-bold text-gb-blue">Acesse sua conta</div>
                        <div className="text-[10px] text-gray-400">ou cadastre-se</div>
                    </div>
                </div>
            </header>
        );

        // 2. HOME (Busca)
        const SearchScreen = ({ onSearch }) => {
            const [origin, setOrigin] = useState('');
            const [dest, setDest] = useState('');
            const [date, setDate] = useState('');
            const [pass, setPass] = useState(1);
            const [loading, setLoading] = useState(false);
            const [originSuggest, setOriginSuggest] = useState([]);
            const [destSuggest, setDestSuggest] = useState([]);
            const [searching, setSearching] = useState({ origin: false, dest: false });
            const [userLoc, setUserLoc] = useState(null);

            useEffect(() => {
                navigator.geolocation.getCurrentPosition(
                    (p) => setUserLoc({ lat: p.coords.latitude, lng: p.coords.longitude }),
                    () => {}
                );
            }, []);

            const haversine = (lat1, lon1, lat2, lon2) => {
                const R = 6371;
                const dLat = (lat2 - lat1) * Math.PI / 180;
                const dLon = (lon2 - lon1) * Math.PI / 180;
                const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
                return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            };

            const handleInput = async (type, value) => {
                if (type === 'origin') setOrigin(value);
                else setDest(value);

                if (value.length < 2) {
                    if (type === 'origin') setOriginSuggest([]);
                    else setDestSuggest([]);
                    return;
                }

                setSearching(prev => ({ ...prev, [type]: true }));
                let results = await searchCities(value);
                if (userLoc) {
                    results = results.map(r => ({ ...r, dist: haversine(userLoc.lat, userLoc.lng, r.lat, r.lng) }));
                    results.sort((a, b) => a.dist - b.dist);
                }
                if (type === 'origin') setOriginSuggest(results.slice(0, 5));
                else setDestSuggest(results.slice(0, 5));
                setSearching(prev => ({ ...prev, [type]: false }));
            };

            const selectCity = (type, city) => {
                const display = `${city.city} - ${city.state}`;
                if (type === 'origin') { setOrigin(display); setOriginSuggest([]); }
                else { setDest(display); setDestSuggest([]); }
            };

            const submit = async (e) => {
                e.preventDefault();
                if (!origin || !dest || !date) return alert('Preencha todos os campos');
                setLoading(true);
                try {
                    await apiCall('/busca', 'POST', { origem: origin, destino: dest, data: date, passageiros: pass });
                    onSearch({ origin, dest, date, pass });
                } catch (err) { alert('Erro: ' + err.message); }
                setLoading(false);
            };

            return (
                <div className="relative max-w-xl mx-auto px-4 pb-8 fade-in">
                    {/* Banner */}
                    <div className="bg-gradient-to-b from-gb-blue to-gb-blue-hover text-white pt-6 pb-14 rounded-b-3xl relative overflow-hidden">
                        <div className="relative z-10 px-2">
                            <div className="flex justify-between items-start">
                                <div>
                                    <div className="text-5xl font-black tracking-tight leading-none mb-1">10<span className="text-3xl">%</span></div>
                                    <div className="text-2xl font-black tracking-tight leading-none mb-1">OFF</div>
                                    <div className="text-xs font-bold uppercase max-w-[150px]">EM VIAGENS DE IDA E VOLTA</div>
                                </div>
                                <div className="bg-gb-yellow text-gb-blue text-center px-3 py-1.5 rounded-lg shadow-md">
                                    <div className="text-[9px] uppercase tracking-wider font-black">Exclusivo</div>
                                    <div className="text-[10px] font-black leading-tight">PARA SITE<br/>E APP!</div>
                                </div>
                            </div>
                        </div>
                        <div className="flex justify-center gap-1 mt-4 relative z-10">
                            <span className="w-2 h-2 rounded-full bg-white"></span>
                            <span className="w-2 h-2 rounded-full bg-white/40"></span>
                        </div>
                    </div>

                    {/* Formulário */}
                    <div className="bg-white rounded-2xl shadow-xl -mt-10 relative z-20 px-5 pt-5 pb-6 border border-gray-100">
                        <form onSubmit={submit} className="space-y-3">
                            
                            <div className="relative">
                                <label className="text-xs font-semibold text-gray-400 block mb-1">Saindo de</label>
                                <div className="flex items-center border-b border-gray-200 pb-1">
                                    <i className="fas fa-map-marker-alt text-gray-400 mr-2"></i>
                                    <input type="text" placeholder="Digite a cidade" value={origin} onChange={e => handleInput('origin', e.target.value)} className="w-full text-base font-medium outline-none bg-transparent" required />
                                    {searching.origin && <div className="spinner w-4 h-4 border-2 ml-auto"></div>}
                                </div>
                                {originSuggest.length > 0 && (
                                    <div className="absolute top-full left-0 right-0 bg-white shadow-lg rounded-lg mt-1 z-50 border border-gray-200 max-h-48 overflow-y-auto">
                                        {originSuggest.map((l, i) => (
                                            <div key={i} onClick={() => selectCity('origin', l)} className="p-3 hover:bg-gray-50 cursor-pointer border-b border-gray-100 flex justify-between items-center">
                                                <div><div className="font-medium text-sm">{l.city} - {l.state}</div><div className="text-xs text-gray-400">{l.terminal}</div></div>
                                                {l.dist && <div className="text-xs text-gb-blue font-bold">{Math.round(l.dist)}km</div>}
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>

                            <div className="flex justify-end -my-1">
                                <button type="button" onClick={() => { setOrigin(dest); setDest(origin); }} className="bg-gray-100 text-gb-blue p-2 rounded-lg hover:bg-gray-200">
                                    <i className="fas fa-exchange-alt"></i>
                                </button>
                            </div>

                            <div className="relative">
                                <label className="text-xs font-semibold text-gray-400 block mb-1">Indo para</label>
                                <div className="flex items-center border-b border-gray-200 pb-1">
                                    <i className="fas fa-map-pin text-gray-400 mr-2"></i>
                                    <input type="text" placeholder="Digite a cidade" value={dest} onChange={e => handleInput('dest', e.target.value)} className="w-full text-base font-medium outline-none bg-transparent" required />
                                    {searching.dest && <div className="spinner w-4 h-4 border-2 ml-auto"></div>}
                                </div>
                                {destSuggest.length > 0 && (
                                    <div className="absolute top-full left-0 right-0 bg-white shadow-lg rounded-lg mt-1 z-50 border border-gray-200 max-h-48 overflow-y-auto">
                                        {destSuggest.map((l, i) => (
                                            <div key={i} onClick={() => selectCity('dest', l)} className="p-3 hover:bg-gray-50 cursor-pointer border-b border-gray-100 flex justify-between items-center">
                                                <div><div className="font-medium text-sm">{l.city} - {l.state}</div><div className="text-xs text-gray-400">{l.terminal}</div></div>
                                                {l.dist && <div className="text-xs text-gb-blue font-bold">{Math.round(l.dist)}km</div>}
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>

                            <div className="grid grid-cols-2 gap-3 pt-1">
                                <div>
                                    <label className="text-xs font-semibold text-gray-400 block mb-1">Ida</label>
                                    <input type="date" value={date} onChange={e => setDate(e.target.value)} className="w-full text-sm font-medium outline-none bg-gray-50 rounded p-2" required />
                                </div>
                                <div>
                                    <label className="text-xs font-semibold text-gray-400 block mb-1">Volta</label>
                                    <input type="date" className="w-full text-sm font-medium outline-none bg-gray-50 rounded p-2" />
                                </div>
                            </div>

                            <div className="pt-1">
                                <label className="text-xs font-semibold text-gray-400 block mb-1">Passageiros</label>
                                <div className="flex items-center bg-gray-50 rounded p-2">
                                    <i className="fas fa-users text-gray-400 mr-3"></i>
                                    <input type="number" min="1" value={pass} onChange={e => setPass(parseInt(e.target.value))} className="w-full text-base font-medium outline-none bg-transparent" />
                                </div>
                            </div>

                            <button type="submit" disabled={loading} className="w-full bg-gb-blue hover:bg-gb-blue-hover text-white font-bold py-3.5 rounded-xl text-base uppercase tracking-wider shadow-md transition disabled:opacity-50">
                                {loading ? <div className="spinner w-5 h-5 border-2 mx-auto border-white border-t-transparent"></div> : 'BUSCAR VIAGEM'}
                            </button>
                        </form>
                    </div>
                </div>
            );
        };

        // 3. TELA DE RESULTADOS (Tickets)
        const TicketsScreen = ({ data, onSelect }) => {
            const [tickets, setTickets] = useState([]);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                setLoading(true);
                setTimeout(() => {
                    const mock = [
                        { id: 1, origem: data.origin, destino: data.dest, data: data.date, valor: 179.99, valorOriginal: 258.64, horario: '22:46', chegada: '07:35 (+1)', duracao: '8:49', empresa: 'GUANABARA', tipo: 'Executivo', terminal: 'Rodoviária de Brasília', pontos: 450, rec: true },
                        { id: 2, origem: data.origin, destino: data.dest, data: data.date, valor: 219.99, valorOriginal: 308.64, horario: '22:46', chegada: '07:35', duracao: '8:49', empresa: 'GUANABARA', tipo: 'Leito', terminal: 'Rodoviária de Brasília', pontos: 550, rec: false },
                    ];
                    setTickets(mock);
                    setLoading(false);
                }, 500);
            }, [data]);

            if (loading) return <div className="flex justify-center py-12"><div className="spinner"></div></div>;

            return (
                <div className="max-w-xl mx-auto px-4 pb-24 fade-in">
                    <div className="flex items-center gap-2 mb-4">
                        <h2 className="text-xl font-bold text-gb-blue">Viagens encontradas</h2>
                        <span className="text-xl">🚍</span>
                    </div>
                    
                    {tickets.map(t => (
                        <div key={t.id} className={`bg-white rounded-xl border mb-3 overflow-hidden shadow-sm ${t.rec ? 'border-2 border-gb-blue' : 'border-gray-200'}`}>
                            {t.rec && <div className="bg-gb-blue text-white text-[10px] font-bold text-center py-1"><i className="fas fa-gem mr-1"></i> A gente recomenda</div>}
                            
                            <div className="p-4 flex flex-col gap-3">
                                <div className="flex justify-between items-start">
                                    <div>
                                        <div className="font-extrabold text-gb-blue text-base"><i className="fas fa-bus mr-1"></i> {t.empresa}</div>
                                        <div className="text-[9px] text-yellow-600 font-bold uppercase tracking-wider">{t.tipo}</div>
                                    </div>
                                    <div className="text-right">
                                        <div className="text-xs text-gray-400 line-through">{formatCurrency(t.valorOriginal)}</div>
                                        <div className="text-xl font-black text-gb-blue">{formatCurrency(t.valor)}</div>
                                    </div>
                                </div>

                                <div className="flex justify-between items-center bg-gray-50 rounded-lg p-2">
                                    <div className="text-center"><div className="text-lg font-bold">{t.horario}</div><div className="text-[9px] font-bold text-gray-500 uppercase">{t.origem}</div></div>
                                    <div className="text-xs text-gray-400 flex flex-col items-center"><span>{t.duracao}</span><i className="far fa-clock"></i></div>
                                    <div className="text-center"><div className="text-lg font-bold">{t.chegada}</div><div className="text-[9px] font-bold text-gray-500 uppercase">{t.destino}</div></div>
                                </div>

                                <div className="flex justify-between items-center border-t border-gray-100 pt-3 mt-1">
                                    <div className="text-xs text-gray-500 flex items-center gap-2"><i className="fas fa-map-marker-alt text-gb-blue"></i> {t.terminal}</div>
                                    <div className="flex items-center gap-3">
                                        <div className="border border-pink-400 text-pink-600 text-[10px] font-bold px-2 py-1 rounded-full bg-white">+{t.pontos} <i className="fas fa-gift"></i></div>
                                        <button onClick={() => onSelect(t)} className="bg-gb-blue text-white font-bold px-4 py-1.5 rounded-lg text-sm hover:bg-gb-blue-hover">Escolher</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    ))}
                </div>
            );
        };

        // 4. DRAWER DE ASSENTOS
        const SeatDrawer = ({ ticket, close, confirm }) => {
            const [selected, setSelected] = useState(null);
            const [step, setStep] = useState('upgrade');
            const [upgraded, setUpgraded] = useState(false);
            const occupied = [3, 7, 12, 15, 18, 22, 28, 33, 37];

            const handleConfirm = () => {
                if (!selected) return;
                let finalPrice = ticket.valor;
                if (upgraded) finalPrice += 40;
                confirm({ ...ticket, assento: selected, precoFinal: finalPrice });
            };

            if (!ticket) return null;

            return (
                <>
                    <div className={`drawer-overlay ${ticket ? 'active' : ''}`} onClick={close}></div>
                    <div className={`drawer-panel ${ticket ? 'active' : ''}`}>
                        <div className="p-4 border-b border-gray-200 flex justify-between items-center bg-white sticky top-0 z-10">
                            <div><div className="text-sm text-gb-blue font-bold">Indo para</div><div className="text-lg font-extrabold">{ticket.destino}</div></div>
                            <button onClick={close} className="text-gray-500 text-xl"><i className="fas fa-times"></i></button>
                        </div>

                        <div className="flex-1 overflow-y-auto p-4 bg-gray-50">
                            {step === 'upgrade' ? (
                                <div className="bg-white rounded-xl p-4 border border-gray-200 slide-up">
                                    <div className="flex justify-between text-xs border-b border-gray-100 pb-3 mb-3">
                                        <div><div className="font-bold">{ticket.origem}</div><div className="text-gray-500">{ticket.horario}</div></div>
                                        <div className="text-center text-gray-400"><i className="fas fa-arrow-right"></i></div>
                                        <div className="text-right"><div className="font-bold">{ticket.destino}</div><div className="text-gray-500">{ticket.chegada}</div></div>
                                    </div>
                                    <div className="font-bold text-gb-blue text-sm mb-3">Confira o Leito</div>
                                    <div className="bg-gb-blue rounded-xl overflow-hidden text-white mb-4">
                                        <img src="https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?auto=format&fit=crop&w=600&q=80" className="h-32 w-full object-cover" />
                                        <div className="p-2 text-xs font-bold flex items-center gap-2"><i className="fas fa-couch"></i> 140° de reclinação</div>
                                    </div>
                                    <button onClick={() => { setUpgraded(true); setStep('seats'); }} className="w-full bg-gb-blue text-white font-bold py-3 rounded-lg mb-2">Upgrade + R$ 40,00</button>
                                    <button onClick={() => { setUpgraded(false); setStep('seats'); }} className="w-full bg-white text-gb-blue border-2 border-gb-blue font-bold py-3 rounded-lg">Manter classe</button>
                                </div>
                            ) : (
                                <div className="bg-white rounded-xl p-4 border border-gray-200 slide-up">
                                    <div className="border-2 border-gray-200 rounded-2xl p-4 max-w-xs mx-auto relative bg-white">
                                        <div className="text-center text-gray-400 text-2xl mb-3"><i className="fas fa-steering-wheel"></i></div>
                                        <div className="seat-wrapper">
                                            {Array.from({ length: 44 }).map((_, i) => {
                                                const num = i + 1;
                                                const isOcc = occupied.includes(num);
                                                return (
                                                    <div key={num} className={`seat ${isOcc ? 'occupied' : 'available'} ${selected === num ? 'selected' : ''}`} onClick={() => !isOcc && setSelected(num)}>
                                                        <i className={`fas fa-couch ${isOcc ? 'text-gray-300' : 'text-green-500'}`}></i>
                                                        <span>{num}</span>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                    <div className="flex justify-around mt-4 text-[10px] font-medium text-gray-500 border-t border-gray-100 pt-4">
                                        <div className="flex flex-col items-center gap-1"><div className="w-4 h-4 border border-green-500 rounded bg-white"></div> Livre</div>
                                        <div className="flex flex-col items-center gap-1"><div className="w-4 h-4 bg-gray-200 border-gray-300 rounded border"></div> Ocupado</div>
                                        <div className="flex flex-col items-center gap-1"><div className="w-4 h-4 bg-gb-yellow rounded border-gb-yellow border"></div> Escolhido</div>
                                    </div>
                                </div>
                            )}
                        </div>

                        {step === 'seats' && (
                            <div className="p-4 border-t border-gray-200 bg-white flex justify-between items-center sticky bottom-0">
                                <div>
                                    <div className="text-sm font-bold text-gb-blue">{selected ? '1 de 1' : '0 de 1'}</div>
                                    <div className="text-xl font-black text-gb-blue">{formatCurrency(ticket.valor + (upgraded ? 40 : 0))}</div>
                                </div>
                                <button onClick={handleConfirm} disabled={!selected} className={`font-bold py-3 px-6 rounded-lg transition ${selected ? 'bg-gb-blue text-white hover:bg-gb-blue-hover' : 'bg-gray-300 text-white cursor-not-allowed'}`}>
                                    Confirmar
                                </button>
                            </div>
                        )}
                    </div>
                </>
            );
        };

        // 5. TELA DE DADOS DO PASSAGEIRO
        const PassengerScreen = ({ ticket, next }) => {
            const [nome, setNome] = useState('');
            const [cpf, setCpf] = useState('');
            const [tel, setTel] = useState('');
            const [email, setEmail] = useState('');
            const [loading, setLoading] = useState(false);

            const submit = (e) => {
                e.preventDefault();
                if (!nome || !cpf || !tel || !email) return alert('Preencha todos os dados');
                setLoading(true);
                localStorage.setItem('cliente_nome', nome);
                localStorage.setItem('cliente_cpf', cpf);
                localStorage.setItem('cliente_telefone', tel);
                localStorage.setItem('cliente_email', email);
                setTimeout(() => { setLoading(false); next(); }, 1500);
            };

            return (
                <div className="max-w-xl mx-auto px-4 pt-4 fade-in">
                    <h2 className="text-xl font-bold text-gb-blue mb-4">Dados do Passageiro</h2>
                    <div className="bg-white p-5 rounded-xl shadow border border-gray-100">
                        <form onSubmit={submit} className="space-y-3">
                            <div><label className="text-xs font-semibold text-gray-500">Nome completo</label><input type="text" value={nome} onChange={e => setNome(e.target.value)} className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-gb-blue outline-none" required /></div>
                            <div><label className="text-xs font-semibold text-gray-500">CPF</label><input type="text" value={cpf} onChange={e => setCpf(e.target.value)} className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-gb-blue outline-none" required /></div>
                            <div><label className="text-xs font-semibold text-gray-500">Telefone</label><input type="text" value={tel} onChange={e => setTel(e.target.value)} className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-gb-blue outline-none" required /></div>
                            <div><label className="text-xs font-semibold text-gray-500">E-mail</label><input type="email" value={email} onChange={e => setEmail(e.target.value)} className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-gb-blue outline-none" required /></div>
                            <button type="submit" disabled={loading} className="w-full bg-gb-blue text-white font-bold py-3 rounded-lg mt-2 hover:bg-gb-blue-hover disabled:opacity-50 flex justify-center items-center">
                                {loading ? <div className="spinner w-5 h-5 border-2 border-white border-t-transparent"></div> : 'Ir para o pagamento'}
                            </button>
                        </form>
                    </div>
                </div>
            );
        };

        // 6. CHECKOUT
        const CheckoutScreen = ({ ticket, finish }) => {
            const [metodo, setMetodo] = useState('pix');
            const [loading, setLoading] = useState(false);
            const [pixCode, setPixCode] = useState('');
            const [qr, setQr] = useState(null);
            const [status, setStatus] = useState('pending');

            const nome = localStorage.getItem('cliente_nome') || '';
            const cpf = localStorage.getItem('cliente_cpf') || '';
            const tel = localStorage.getItem('cliente_telefone') || '';

            const handlePay = async () => {
                setLoading(true);
                try {
                    const cliente = await apiCall('/cliente', 'POST', { nome, cpf, telefone: tel, email: localStorage.getItem('cliente_email'), qtdCriancas: 0 });
                    const codigo = 'GV' + new Date().toISOString().slice(0,10).replace(/-/g,'') + String(Math.floor(Math.random()*1000)).padStart(3,'0');
                    await apiCall('/compra', 'POST', {
                        origem: ticket.origem, destino: ticket.destino, passageiro: nome, data: ticket.data, valor: ticket.precoFinal, metodoPagamento: metodo === 'pix' ? 'PIX' : 'Cartão', codigo: codigo
                    });
                    localStorage.setItem('ticket_codigo', codigo);
                    finish(codigo);
                } catch (err) { alert('Erro: ' + err.message); }
                setLoading(false);
            };

            const gerarPix = async () => {
                if (pixCode) return;
                try {
                    const res = await apiCall('/create-payment', 'POST', { amount: ticket.precoFinal, customer_name: nome, customer_cpf: cpf, customer_phone: tel });
                    if (res.success) {
                        setPixCode(res.payment.pix_code);
                        setTimeout(() => setStatus('paid'), 4000);
                    }
                } catch (err) { alert('Erro PIX'); }
            };

            useEffect(() => {
                if (pixCode && !qr) {
                    const qrcode = new QRCode(document.getElementById('qrcode'), { text: pixCode, width: 160, height: 160 });
                    setQr(qrcode);
                }
            }, [pixCode]);

            return (
                <div className="max-w-xl mx-auto px-4 pt-4 fade-in">
                    <h2 className="text-xl font-bold text-gb-blue mb-4">Finalizar Compra</h2>
                    
                    <div className="bg-white p-4 rounded-xl shadow border border-gray-100 mb-4">
                        <div className="grid grid-cols-2 text-sm gap-2">
                            <div className="text-gray-500">Origem:</div><div className="font-bold">{ticket.origem}</div>
                            <div className="text-gray-500">Destino:</div><div className="font-bold">{ticket.destino}</div>
                            <div className="text-gray-500">Assento:</div><div className="font-bold">{ticket.assento}</div>
                            <div className="text-gray-500">Total:</div><div className="font-bold text-gb-blue">{formatCurrency(ticket.precoFinal)}</div>
                        </div>
                    </div>

                    <div className="flex gap-2 mb-4">
                        <button onClick={() => setMetodo('pix')} className={`flex-1 py-2 rounded-lg font-bold text-sm ${metodo === 'pix' ? 'bg-gb-blue text-white' : 'bg-gray-100'}`}>PIX</button>
                        <button onClick={() => setMetodo('cartao')} className={`flex-1 py-2 rounded-lg font-bold text-sm ${metodo === 'cartao' ? 'bg-gb-blue text-white' : 'bg-gray-100'}`}>Cartão</button>
                    </div>

                    {metodo === 'pix' && (
                        <div className="bg-white p-4 rounded-lg shadow border border-gray-100 text-center">
                            {!pixCode ? (
                                <button onClick={gerarPix} className="bg-gb-yellow text-white font-bold py-2 px-6 rounded-lg text-sm">Gerar PIX</button>
                            ) : (
                                <>
                                    <div id="qrcode" className="flex justify-center mb-2"></div>
                                    <div className="text-xs text-gray-500 mb-2">Escaneie o QR Code</div>
                                    {status === 'paid' ? <div className="text-green-600 font-bold text-sm">✅ Confirmado!</div> : <div className="text-gb-yellow font-bold text-sm animate-pulse">⏳ Aguardando...</div>}
                                </>
                            )}
                        </div>
                    )}

                    <button onClick={handlePay} disabled={loading || (metodo === 'pix' && status !== 'paid')} className="w-full mt-4 bg-gb-blue text-white font-bold py-3 rounded-xl text-base uppercase tracking-wider hover:bg-gb-blue-hover disabled:opacity-50">
                        {loading ? <div className="spinner w-5 h-5 border-2 border-white border-t-transparent mx-auto"></div> : 'Confirmar Pagamento'}
                    </button>
                </div>
            );
        };

        // 7. COMPROVANTE
        const ReceiptScreen = ({ codigo }) => {
            const nome = localStorage.getItem('cliente_nome') || 'Passageiro';
            return (
                <div className="max-w-xl mx-auto px-4 py-8 text-center fade-in">
                    <div className="bg-green-100 text-green-700 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4 text-4xl">
                        <i className="fas fa-check"></i>
                    </div>
                    <h2 className="text-2xl font-bold text-green-700 mb-2">Pagamento Confirmado!</h2>
                    <p className="text-gray-500 text-sm mb-6">Sua passagem foi emitida com sucesso.</p>
                    <div className="bg-white p-6 rounded-xl shadow text-left border border-gray-100">
                        <div className="flex justify-between py-2 border-b border-gray-100 text-sm"><span className="font-bold text-gray-500">Código:</span><span className="font-mono font-bold">{codigo}</span></div>
                        <div className="flex justify-between py-2 border-b border-gray-100 text-sm"><span className="font-bold text-gray-500">Passageiro:</span><span className="font-bold">{nome}</span></div>
                        <div className="flex justify-between py-2 text-sm"><span className="font-bold text-gray-500">Status:</span><span className="text-green-600 font-bold">CONFIRMADO</span></div>
                    </div>
                    <button onClick={() => window.location.reload()} className="mt-6 bg-gb-blue text-white font-bold py-3 px-8 rounded-lg">Nova compra</button>
                </div>
            );
        };

        // 8. BOTTOM NAV
        const BottomNav = ({ current }) => (
            <nav className="fixed bottom-0 left-0 right-0 z-30 bg-white border-t border-gray-200 shadow-lg flex justify-around items-center py-2 max-w-xl mx-auto">
                <button className={`flex flex-col items-center gap-0.5 ${current === 'home' ? 'text-gb-blue' : 'text-gray-400'}`}>
                    <i className="fas fa-search text-lg"></i>
                    <span className="text-[10px] font-bold">Busca</span>
                </button>
                <button className={`flex flex-col items-center gap-0.5 ${current === 'services' ? 'text-gb-blue' : 'text-gray-400'}`}>
                    <i className="fas fa-concierge-bell text-lg"></i>
                    <span className="text-[10px] font-bold">Serviços</span>
                </button>
                <button className={`flex flex-col items-center gap-0.5 ${current === 'account' ? 'text-gb-blue' : 'text-gray-400'}`}>
                    <i className="fas fa-user-circle text-lg"></i>
                    <span className="text-[10px] font-bold">Conta</span>
                </button>
                <button className={`flex flex-col items-center gap-0.5 ${current === 'help' ? 'text-gb-blue' : 'text-gray-400'}`}>
                    <i className="fas fa-question-circle text-lg"></i>
                    <span className="text-[10px] font-bold">Ajuda</span>
                </button>
            </nav>
        );

        // ===========================
        // APP PRINCIPAL
        // ===========================
        const App = () => {
            const [screen, setScreen] = useState('home');
            const [searchData, setSearchData] = useState(null);
            const [selectedTicket, setSelectedTicket] = useState(null);
            const [receiptCode, setReceiptCode] = useState(null);

            const goHome = () => { setScreen('home'); setSearchData(null); setSelectedTicket(null); setReceiptCode(null); };

            return (
                <div className="pb-20 min-h-screen flex flex-col">
                    <Header showBack={screen !== 'home'} onBack={goHome} />
                    <main className="flex-1">
                        {screen === 'home' && <SearchScreen onSearch={(d) => { setSearchData(d); setScreen('tickets'); }} />}
                        {screen === 'tickets' && searchData && <TicketsScreen data={searchData} onSelect={(t) => setSelectedTicket(t)} />}
                        {screen === 'passenger' && selectedTicket && <PassengerScreen ticket={selectedTicket} next={() => setScreen('checkout')} />}
                        {screen === 'checkout' && selectedTicket && <CheckoutScreen ticket={selectedTicket} finish={(c) => { setReceiptCode(c); setScreen('receipt'); }} />}
                        {screen === 'receipt' && receiptCode && <ReceiptScreen codigo={receiptCode} />}
                        {['services', 'account', 'help'].includes(screen) && (
                            <div className="max-w-xl mx-auto px-4 pt-6 text-center text-gray-500">
                                <i className="fas fa-tools text-4xl text-gb-blue mb-2"></i>
                                <p className="font-medium text-gb-blue">Funcionalidade em construção</p>
                            </div>
                        )}
                    </main>
                    <BottomNav current={screen} />
                    <SeatDrawer ticket={selectedTicket} close={() => setSelectedTicket(null)} confirm={(t) => { setSelectedTicket(t); setScreen('passenger'); }} />
                    <a href="https://wa.me/" className="fixed bottom-20 right-4 z-20 bg-gb-whatsapp text-white p-3 rounded-full shadow-xl"><i className="fab fa-whatsapp text-2xl"></i></a>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
