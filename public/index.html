<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Viaje Guanabara - Passagens de Ônibus</title>
    
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gb: {
                            blue: '#123481',
                            'blue-hover': '#1d4499',
                            yellow: '#E79F01',
                            whatsapp: '#00C853',
                            red: '#9A3026',
                            text: '#333333',
                            muted: '#888888',
                            bg: '#F4F7FA',
                            input: '#F5F5F5'
                        }
                    }
                }
            }
        }
    </script>

    <!-- Fontes e Libs -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; background: #F4F7FA; color: #333; -webkit-font-smoothing: antialiased; }
        
        /* Slider */
        .slider-container {
            position: relative;
            width: 100%;
            height: 200px;
            overflow: hidden;
            border-radius: 16px;
        }
        .slider-slide {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            object-fit: cover;
        }
        .slider-slide.active {
            opacity: 1;
        }
        .slider-dots {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 10;
        }
        .slider-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255,255,255,0.5);
            cursor: pointer;
            transition: all 0.3s;
        }
        .slider-dot.active {
            background: #fff;
            width: 24px;
            border-radius: 4px;
        }

        /* Cards de destino */
        .dest-card {
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .dest-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.1);
        }

        /* Spinner */
        .spinner { width: 30px; height: 30px; border: 3px solid #e5e7eb; border-top: 3px solid #123481; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Assentos */
        .seat-wrapper { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
        .seat { 
            width: 38px; height: 38px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 700; font-size: 10px; cursor: pointer; transition: all 0.2s; border: 2px solid #d1d5db; background: #fff; color: #374151; position: relative;
        }
        .seat.available { border-color: #22c55e; color: #15803d; }
        .seat.available:hover { transform: scale(1.05); box-shadow: 0 4px 12px rgba(34,197,94,0.3); }
        .seat.selected { border-color: #E79F01; background: #E79F01; color: white; transform: scale(1.08); box-shadow: 0 4px 16px rgba(231,159,1,0.4); }
        .seat.occupied { background: #f3f4f6; border-color: #e5e7eb; color: #9ca3af; cursor: not-allowed; opacity: 0.6; }
        .seat i { font-size: 14px; margin-bottom: 1px; }

        /* Bottom Nav */
        .bottom-nav {
            backdrop-filter: blur(10px);
            background: rgba(255,255,255,0.95);
        }

        /* Animações */
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        
        .slide-up { animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        /* Drawer */
        .drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 998; display: none; backdrop-filter: blur(4px); }
        .drawer-overlay.active { display: block; }
        .drawer-panel { position: fixed; bottom: -100%; left: 0; right: 0; max-height: 92vh; background: white; z-index: 999; border-radius: 24px 24px 0 0; transition: bottom 0.4s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; box-shadow: 0 -20px 40px rgba(0,0,0,0.15); overflow: hidden; }
        .drawer-panel.active { bottom: 0; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }

        @media (max-width: 480px) {
            .seat { width: 32px; height: 32px; font-size: 9px; }
            .seat i { font-size: 12px; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // ===========================
        // DADOS MOCK
        // ===========================
        const DESTINOS_POPULARES = [
            { id: 1, cidade: 'Rio de Janeiro', estado: 'RJ', preco: 'R$ 89,90', imagem: 'https://images.unsplash.com/photo-1580910051074-3eb694886c5f?w=400&h=300&fit=crop' },
            { id: 2, cidade: 'São Paulo', estado: 'SP', preco: 'R$ 99,90', imagem: 'https://images.unsplash.com/photo-1542831371-29b0f74f9713?w=400&h=300&fit=crop' },
            { id: 3, cidade: 'Belo Horizonte', estado: 'MG', preco: 'R$ 79,90', imagem: 'https://images.unsplash.com/photo-1579043285762-9e0a27e1b3c5?w=400&h=300&fit=crop' },
            { id: 4, cidade: 'Curitiba', estado: 'PR', preco: 'R$ 119,90', imagem: 'https://images.unsplash.com/photo-1600721391779-89fa2f1f8211?w=400&h=300&fit=crop' },
            { id: 5, cidade: 'Porto Alegre', estado: 'RS', preco: 'R$ 149,90', imagem: 'https://images.unsplash.com/photo-1511190887356-4931bdb2d3d1?w=400&h=300&fit=crop' },
            { id: 6, cidade: 'Salvador', estado: 'BA', preco: 'R$ 129,90', imagem: 'https://images.unsplash.com/photo-1580489944761-15a19d654956?w=400&h=300&fit=crop' },
        ];

        const SLIDER_IMAGENS = [
            'https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?w=1200&h=400&fit=crop',
            'https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?w=1200&h=400&fit=crop',
            'https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?w=1200&h=400&fit=crop',
        ];

        // ===========================
        // COMPONENTES
        // ===========================

        // 1. HEADER
        const Header = () => (
            <header className="sticky top-0 z-30 bg-white/95 backdrop-blur-sm shadow-sm border-b border-gray-100 px-4 py-3 flex justify-between items-center">
                <img src="/img/logo.webp" alt="Guanabara" className="h-8 object-contain" onError={(e) => e.target.style.display='none'} />
                <div className="flex items-center gap-3">
                    <button className="text-gb-blue text-sm font-bold hidden sm:block">Entrar</button>
                    <div className="w-8 h-8 bg-gb-red/10 rounded-full flex items-center justify-center text-gb-red text-sm">
                        <i className="fas fa-user"></i>
                    </div>
                </div>
            </header>
        );

        // 2. SLIDER BANNER
        const SliderBanner = () => {
            const [current, setCurrent] = useState(0);

            useEffect(() => {
                const interval = setInterval(() => {
                    setCurrent((prev) => (prev + 1) % SLIDER_IMAGENS.length);
                }, 4000);
                return () => clearInterval(interval);
            }, []);

            return (
                <div className="slider-container">
                    {SLIDER_IMAGENS.map((img, index) => (
                        <img 
                            key={index}
                            src={img} 
                            alt={`Slide ${index + 1}`}
                            className={`slider-slide ${current === index ? 'active' : ''}`}
                        />
                    ))}
                    <div className="slider-dots">
                        {SLIDER_IMAGENS.map((_, index) => (
                            <div 
                                key={index}
                                className={`slider-dot ${current === index ? 'active' : ''}`}
                                onClick={() => setCurrent(index)}
                            />
                        ))}
                    </div>
                </div>
            );
        };

        // 3. HOME (Busca)
        const SearchScreen = ({ onSearch }) => {
            const [origin, setOrigin] = useState('');
            const [dest, setDest] = useState('');
            const [date, setDate] = useState('');
            const [pass, setPass] = useState(1);
            const [loading, setLoading] = useState(false);

            const submit = async (e) => {
                e.preventDefault();
                if (!origin || !dest || !date) return alert('Preencha todos os campos');
                setLoading(true);
                setTimeout(() => {
                    onSearch({ origin, dest, date, pass });
                    setLoading(false);
                }, 800);
            };

            return (
                <div className="relative max-w-xl mx-auto px-4 pb-8 fade-in">
                    {/* Banner Slider */}
                    <div className="mb-4">
                        <SliderBanner />
                    </div>

                    {/* Formulário */}
                    <div className="bg-white rounded-2xl shadow-xl -mt-10 relative z-20 px-5 pt-5 pb-6 border border-gray-100">
                        <form onSubmit={submit} className="space-y-3">
                            <div>
                                <label className="text-xs font-semibold text-gray-400 block mb-1">Saindo de</label>
                                <div className="flex items-center border-b border-gray-200 pb-1">
                                    <i className="fas fa-map-marker-alt text-gb-blue mr-2"></i>
                                    <input type="text" placeholder="Digite a cidade" value={origin} onChange={e => setOrigin(e.target.value)} className="w-full text-base font-medium outline-none bg-transparent" required />
                                </div>
                            </div>

                            <div className="flex justify-center -my-1">
                                <button type="button" onClick={() => { setOrigin(dest); setDest(origin); }} className="bg-gb-blue/10 text-gb-blue p-2 rounded-full hover:bg-gb-blue/20 transition w-10 h-10 flex items-center justify-center">
                                    <i className="fas fa-exchange-alt"></i>
                                </button>
                            </div>

                            <div>
                                <label className="text-xs font-semibold text-gray-400 block mb-1">Indo para</label>
                                <div className="flex items-center border-b border-gray-200 pb-1">
                                    <i className="fas fa-map-pin text-gb-blue mr-2"></i>
                                    <input type="text" placeholder="Digite a cidade" value={dest} onChange={e => setDest(e.target.value)} className="w-full text-base font-medium outline-none bg-transparent" required />
                                </div>
                            </div>

                            <div className="grid grid-cols-2 gap-3 pt-1">
                                <div>
                                    <label className="text-xs font-semibold text-gray-400 block mb-1">Ida</label>
                                    <input type="date" value={date} onChange={e => setDate(e.target.value)} className="w-full text-sm font-medium outline-none bg-gray-50 rounded-lg p-2" required />
                                </div>
                                <div>
                                    <label className="text-xs font-semibold text-gray-400 block mb-1">Volta</label>
                                    <input type="date" className="w-full text-sm font-medium outline-none bg-gray-50 rounded-lg p-2" />
                                </div>
                            </div>

                            <div>
                                <label className="text-xs font-semibold text-gray-400 block mb-1">Passageiros</label>
                                <div className="flex items-center bg-gray-50 rounded-lg p-2">
                                    <i className="fas fa-users text-gb-blue mr-3"></i>
                                    <input type="number" min="1" value={pass} onChange={e => setPass(parseInt(e.target.value))} className="w-full text-base font-medium outline-none bg-transparent" />
                                </div>
                            </div>

                            <button type="submit" disabled={loading} className="w-full bg-gb-blue hover:bg-gb-blue-hover text-white font-bold py-3.5 rounded-xl text-base uppercase tracking-wider shadow-lg transition disabled:opacity-50">
                                {loading ? <div className="spinner w-5 h-5 border-2 mx-auto border-white border-t-transparent"></div> : 'BUSCAR VIAGEM'}
                            </button>
                        </form>
                    </div>

                    {/* Destinos Populares */}
                    <div className="mt-8">
                        <h3 className="text-lg font-bold text-gb-blue mb-4 flex items-center gap-2">
                            <i className="fas fa-fire text-gb-yellow"></i> Destinos mais procurados
                        </h3>
                        <div className="grid grid-cols-2 gap-3">
                            {DESTINOS_POPULARES.slice(0, 4).map(destino => (
                                <div key={destino.id} className="dest-card bg-white rounded-xl overflow-hidden shadow-sm border border-gray-100">
                                    <img src={destino.imagem} alt={destino.cidade} className="w-full h-24 object-cover" />
                                    <div className="p-3">
                                        <div className="font-bold text-sm">{destino.cidade}</div>
                                        <div className="text-xs text-gray-500">{destino.estado}</div>
                                        <div className="text-gb-blue font-bold text-sm mt-1">{destino.preco}</div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* Ofertas */}
                    <div className="mt-6 bg-gradient-to-r from-gb-blue to-gb-blue-hover rounded-2xl p-4 text-white">
                        <div className="flex justify-between items-center">
                            <div>
                                <div className="text-xs font-bold opacity-80">OFERTA ESPECIAL</div>
                                <div className="text-2xl font-black">25% OFF</div>
                                <div className="text-sm font-medium">em compras de ida e volta</div>
                            </div>
                            <div className="bg-gb-yellow text-gb-blue px-4 py-2 rounded-lg font-bold text-sm">
                                Ver ofertas
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // 4. TELA DE RESULTADOS (Tickets)
        const TicketsScreen = ({ data, onSelect }) => {
            const [tickets, setTickets] = useState([]);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                setLoading(true);
                setTimeout(() => {
                    const mock = [
                        { id: 1, origem: data.origin, destino: data.dest, data: data.date, valor: 179.99, valorOriginal: 258.64, horario: '22:46', chegada: '07:35 (+1)', duracao: '8:49', empresa: 'GUANABARA', tipo: 'Executivo', terminal: 'Rodoviária de Brasília', pontos: 450, rec: true },
                        { id: 2, origem: data.origin, destino: data.dest, data: data.date, valor: 219.99, valorOriginal: 308.64, horario: '22:46', chegada: '07:35', duracao: '8:49', empresa: 'GUANABARA', tipo: 'Leito', terminal: 'Rodoviária de Brasília', pontos: 550, rec: false },
                    ];
                    setTickets(mock);
                    setLoading(false);
                }, 500);
            }, [data]);

            if (loading) return <div className="flex justify-center py-12"><div className="spinner"></div></div>;

            return (
                <div className="max-w-xl mx-auto px-4 pb-24 fade-in">
                    <div className="flex items-center gap-2 mb-4">
                        <h2 className="text-xl font-bold text-gb-blue">Viagens encontradas</h2>
                        <span className="text-xl">🚍</span>
                    </div>
                    
                    {tickets.map(t => (
                        <div key={t.id} className={`bg-white rounded-xl border mb-3 overflow-hidden shadow-sm hover:shadow-md transition ${t.rec ? 'border-2 border-gb-blue' : 'border-gray-200'}`}>
                            {t.rec && <div className="bg-gb-blue text-white text-[10px] font-bold text-center py-1"><i className="fas fa-gem mr-1"></i> A gente recomenda</div>}
                            
                            <div className="p-4 flex flex-col gap-3">
                                <div className="flex justify-between items-start">
                                    <div>
                                        <div className="font-extrabold text-gb-blue text-base"><i className="fas fa-bus mr-1"></i> {t.empresa}</div>
                                        <div className="text-[9px] text-yellow-600 font-bold uppercase tracking-wider">{t.tipo}</div>
                                    </div>
                                    <div className="text-right">
                                        <div className="text-xs text-gray-400 line-through">{formatCurrency(t.valorOriginal)}</div>
                                        <div className="text-xl font-black text-gb-blue">{formatCurrency(t.valor)}</div>
                                    </div>
                                </div>

                                <div className="flex justify-between items-center bg-gray-50 rounded-lg p-2">
                                    <div className="text-center"><div className="text-lg font-bold">{t.horario}</div><div className="text-[9px] font-bold text-gray-500 uppercase">{t.origem}</div></div>
                                    <div className="text-xs text-gray-400 flex flex-col items-center"><span>{t.duracao}</span><i className="far fa-clock"></i></div>
                                    <div className="text-center"><div className="text-lg font-bold">{t.chegada}</div><div className="text-[9px] font-bold text-gray-500 uppercase">{t.destino}</div></div>
                                </div>

                                <div className="flex justify-between items-center border-t border-gray-100 pt-3 mt-1">
                                    <div className="text-xs text-gray-500 flex items-center gap-2"><i className="fas fa-map-marker-alt text-gb-blue"></i> {t.terminal}</div>
                                    <div className="flex items-center gap-3">
                                        <div className="border border-pink-400 text-pink-600 text-[10px] font-bold px-2 py-1 rounded-full bg-white">+{t.pontos} <i className="fas fa-gift"></i></div>
                                        <button onClick={() => onSelect(t)} className="bg-gb-blue text-white font-bold px-4 py-1.5 rounded-lg text-sm hover:bg-gb-blue-hover transition">Escolher</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    ))}
                </div>
            );
        };

        // 5. DRAWER DE ASSENTOS (Melhorado)
        const SeatDrawer = ({ ticket, close, confirm }) => {
            const [selected, setSelected] = useState(null);
            const occupied = [3, 7, 12, 15, 18, 22, 28, 33, 37];

            const handleConfirm = () => {
                if (!selected) return;
                confirm({ ...ticket, assento: selected });
            };

            if (!ticket) return null;

            return (
                <>
                    <div className={`drawer-overlay ${ticket ? 'active' : ''}`} onClick={close}></div>
                    <div className={`drawer-panel ${ticket ? 'active' : ''}`}>
                        <div className="p-4 border-b border-gray-200 flex justify-between items-center bg-white sticky top-0 z-10">
                            <div>
                                <div className="text-xs text-gray-500">Escolha seu assento</div>
                                <div className="text-lg font-extrabold text-gb-blue">{ticket.destino}</div>
                            </div>
                            <button onClick={close} className="text-gray-500 text-xl hover:bg-gray-100 w-10 h-10 rounded-full flex items-center justify-center transition">
                                <i className="fas fa-times"></i>
                            </button>
                        </div>

                        <div className="flex-1 overflow-y-auto p-4 bg-gray-50">
                            <div className="bg-white rounded-xl p-4 border border-gray-200 slide-up">
                                <div className="flex justify-between text-xs border-b border-gray-100 pb-3 mb-3">
                                    <div><div className="font-bold">{ticket.origem}</div><div className="text-gray-500">{ticket.horario}</div></div>
                                    <div className="text-center text-gray-400"><i className="fas fa-arrow-right"></i></div>
                                    <div className="text-right"><div className="font-bold">{ticket.destino}</div><div className="text-gray-500">{ticket.chegada}</div></div>
                                </div>
                                
                                <div className="border-2 border-gray-200 rounded-2xl p-4 max-w-xs mx-auto relative bg-white">
                                    <div className="text-center text-gray-400 text-2xl mb-3"><i className="fas fa-steering-wheel"></i></div>
                                    <div className="seat-wrapper">
                                        {Array.from({ length: 44 }).map((_, i) => {
                                            const num = i + 1;
                                            const isOcc = occupied.includes(num);
                                            return (
                                                <div key={num} className={`seat ${isOcc ? 'occupied' : 'available'} ${selected === num ? 'selected' : ''}`} onClick={() => !isOcc && setSelected(num)}>
                                                    <i className={`fas fa-couch ${isOcc ? 'text-gray-300' : 'text-green-500'}`}></i>
                                                    <span>{num}</span>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                                <div className="flex justify-around mt-4 text-[10px] font-medium text-gray-500 border-t border-gray-100 pt-4">
                                    <div className="flex flex-col items-center gap-1"><div className="w-4 h-4 border border-green-500 rounded bg-white"></div> Livre</div>
                                    <div className="flex flex-col items-center gap-1"><div className="w-4 h-4 bg-gray-200 border-gray-300 rounded border"></div> Ocupado</div>
                                    <div className="flex flex-col items-center gap-1"><div className="w-4 h-4 bg-gb-yellow rounded border-gb-yellow border"></div> Escolhido</div>
                                </div>
                            </div>
                        </div>

                        <div className="p-4 border-t border-gray-200 bg-white flex justify-between items-center sticky bottom-0">
                            <div>
                                <div className="text-xs text-gray-500">Assento selecionado</div>
                                <div className="text-xl font-black text-gb-blue">{selected ? `Poltrona ${selected}` : 'Nenhum'}</div>
                            </div>
                            <button onClick={handleConfirm} disabled={!selected} className={`font-bold py-3 px-8 rounded-xl transition ${selected ? 'bg-gb-blue text-white hover:bg-gb-blue-hover shadow-lg' : 'bg-gray-300 text-white cursor-not-allowed'}`}>
                                Confirmar <i className="fas fa-arrow-right ml-1"></i>
                            </button>
                        </div>
                    </div>
                </>
            );
        };

        // 6. BOTTOM NAV (Melhorado)
        const BottomNav = ({ current, setScreen }) => {
            const navItems = [
                { id: 'home', icon: 'fa-search', label: 'Busca' },
                { id: 'services', icon: 'fa-concierge-bell', label: 'Serviços' },
                { id: 'account', icon: 'fa-user-circle', label: 'Conta' },
                { id: 'help', icon: 'fa-question-circle', label: 'Ajuda' },
            ];

            return (
                <nav className="fixed bottom-0 left-0 right-0 z-30 bottom-nav border-t border-gray-200 shadow-lg flex justify-around items-center py-2 max-w-xl mx-auto">
                    {navItems.map(item => (
                        <button 
                            key={item.id}
                            onClick={() => setScreen(item.id)}
                            className={`flex flex-col items-center gap-0.5 px-3 py-1 rounded-lg transition ${current === item.id ? 'text-gb-blue' : 'text-gray-400'}`}
                        >
                            <i className={`fas ${item.icon} text-lg ${current === item.id ? 'text-gb-blue' : ''}`}></i>
                            <span className="text-[10px] font-bold">{item.label}</span>
                            {current === item.id && <div className="w-1 h-1 bg-gb-blue rounded-full mt-0.5"></div>}
                        </button>
                    ))}
                </nav>
            );
        };

        // 7. TELAS DE SERVIÇOS, CONTA, AJUDA (Melhoradas)
        const ServicesScreen = () => (
            <div className="max-w-xl mx-auto px-4 pt-6 fade-in">
                <h2 className="text-xl font-bold text-gb-blue mb-4">Serviços</h2>
                <div className="grid grid-cols-2 gap-3">
                    {['Wi-Fi', 'Ar Condicionado', 'Banheiro', 'Tomada USB', 'Poltrona Reclinável', 'TV a Bordo'].map(service => (
                        <div key={service} className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 text-center hover:shadow-md transition">
                            <i className={`fas fa-${service === 'Wi-Fi' ? 'wifi' : service === 'Ar Condicionado' ? 'snowflake' : service === 'Banheiro' ? 'restroom' : service === 'Tomada USB' ? 'usb' : service === 'Poltrona Reclinável' ? 'couch' : 'tv'} text-2xl text-gb-blue mb-2`}></i>
                            <div className="text-sm font-bold">{service}</div>
                        </div>
                    ))}
                </div>
            </div>
        );

        const AccountScreen = () => (
            <div className="max-w-xl mx-auto px-4 pt-6 fade-in">
                <h2 className="text-xl font-bold text-gb-blue mb-4">Minha Conta</h2>
                <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-6 text-center">
                    <div className="w-20 h-20 bg-gb-blue/10 rounded-full flex items-center justify-center mx-auto mb-3">
                        <i className="fas fa-user text-4xl text-gb-blue"></i>
                    </div>
                    <div className="font-bold text-lg">Faça login</div>
                    <div className="text-sm text-gray-500 mb-4">Acesse sua conta para ver suas viagens</div>
                    <button className="bg-gb-blue text-white px-6 py-2 rounded-lg font-bold hover:bg-gb-blue-hover transition">Entrar</button>
                </div>
            </div>
        );

        const HelpScreen = () => (
            <div className="max-w-xl mx-auto px-4 pt-6 fade-in">
                <h2 className="text-xl font-bold text-gb-blue mb-4">Ajuda</h2>
                <div className="space-y-3">
                    {['Como comprar passagem?', 'Cancelamento e reembolso', 'Bagagem', 'Política de privacidade', 'Contato'].map(item => (
                        <div key={item} className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center hover:shadow-md transition cursor-pointer">
                            <span className="font-medium">{item}</span>
                            <i className="fas fa-chevron-right text-gray-400"></i>
                        </div>
                    ))}
                </div>
                <div className="mt-6 bg-gb-blue rounded-xl p-4 text-white text-center">
                    <div className="font-bold">SAC 0800 728 1992</div>
                    <div className="text-sm opacity-80">Atendimento 24h</div>
                </div>
            </div>
        );

        // ===========================
        // APP PRINCIPAL
        // ===========================
        const App = () => {
            const [screen, setScreen] = useState('home');
            const [searchData, setSearchData] = useState(null);
            const [selectedTicket, setSelectedTicket] = useState(null);

            const goHome = () => { setScreen('home'); setSearchData(null); setSelectedTicket(null); };

            const renderScreen = () => {
                switch(screen) {
                    case 'home': return <SearchScreen onSearch={(d) => { setSearchData(d); setScreen('tickets'); }} />;
                    case 'tickets': return searchData ? <TicketsScreen data={searchData} onSelect={(t) => setSelectedTicket(t)} /> : <SearchScreen onSearch={() => {}} />;
                    case 'services': return <ServicesScreen />;
                    case 'account': return <AccountScreen />;
                    case 'help': return <HelpScreen />;
                    default: return <SearchScreen onSearch={() => {}} />;
                }
            };

            return (
                <div className="pb-20 min-h-screen flex flex-col">
                    <Header />
                    <main className="flex-1">
                        {renderScreen()}
                    </main>
                    <BottomNav current={screen} setScreen={setScreen} />
                    <SeatDrawer 
                        ticket={selectedTicket} 
                        close={() => setSelectedTicket(null)} 
                        confirm={(t) => {
                            // Salva os dados e redireciona para checkout.html
                            localStorage.setItem('produto_origem', t.origem);
                            localStorage.setItem('produto_destino', t.destino);
                            localStorage.setItem('produto_preco', t.valor);
                            localStorage.setItem('produto_assento', t.assento);
                            localStorage.setItem('produto_categoria', t.tipo);
                            localStorage.setItem('produto_data', t.data);
                            
                            // Redireciona para checkout
                            window.location.href = 'checkout.html';
                        }} 
                    />
                    <a href="https://wa.me/" className="fixed bottom-20 right-4 z-20 bg-gb-whatsapp text-white p-3 rounded-full shadow-xl hover:scale-110 transition">
                        <i className="fab fa-whatsapp text-2xl"></i>
                    </a>
                </div>
            );
        };

        // ===========================
        // RENDER
        // ===========================
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
