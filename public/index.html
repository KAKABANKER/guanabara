<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Viaje Guanabara - Passagens de Ônibus</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gb: {
              blue: '#123481',
              'blue-hover': '#1d4499',
              yellow: '#E79F01',
              whatsapp: '#00C853',
              red: '#9A3026',
              text: '#333333',
              muted: '#888888',
              bg: '#F4F7FA',
              input: '#F5F5F5'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; color: #333333; -webkit-font-smoothing: antialiased; }
    .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #123481; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .seat { width: 50px; height: 50px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; transition: all 0.2s; border: 2px solid #e5e7eb; }
    .seat.available { background: #f3f4f6; }
    .seat.available:hover { border-color: #123481; transform: scale(1.05); }
    .seat.selected { background: #E79F01; border-color: #E79F01; color: white; }
    .seat.occupied { background: #d1d5db; border-color: #d1d5db; color: #9ca3af; cursor: not-allowed; }
    .page-transition { animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-gb-bg min-h-screen">

  <div id="root"></div>

  <script type="text/babel">
    // ===========================
    // CONFIGURAÇÃO
    // ===========================
    const API_URL = window.location.origin + '/api';
    let token = localStorage.getItem('token') || '';

    // ===========================
    // UTILITÁRIOS
    // ===========================
    const formatDate = (dateStr) => {
      if (!dateStr) return '';
      const [y, m, d] = dateStr.split('-');
      return `${d}/${m}/${y}`;
    };

    const formatCurrency = (value) => {
      return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(value);
    };

    const apiCall = async (endpoint, method = 'GET', data = null) => {
      const headers = { 'Content-Type': 'application/json' };
      if (token) headers['Authorization'] = 'Bearer ' + token;
      const options = { method, headers };
      if (data) options.body = JSON.stringify(data);
      const response = await fetch(API_URL + endpoint, options);
      const result = await response.json();
      if (!response.ok) throw new Error(result.error || 'Erro na requisição');
      return result;
    };

    // ===========================
    // ESTADO GLOBAL (Contexto Simples)
    // ===========================
    const AppContext = React.createContext();

    // ===========================
    // COMPONENTES
    // ===========================

    // 1. HEADER
    const Header = () => {
      return (
        <header className="sticky top-0 z-50 bg-white shadow-sm border-b border-gray-100">
          <div className="flex items-center justify-between p-4 max-w-xl mx-auto">
            <div className="flex items-center gap-3">
              <button aria-label="Abrir menu" className="text-gb-blue">
                <svg className="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M4 6h16M4 12h16M4 18h16" />
                </svg>
              </button>
              <div className="font-extrabold text-2xl tracking-tighter text-gb-blue flex items-center">
                GUANABARA
              </div>
            </div>
            <div className="flex items-center gap-2">
              <div className="w-9 h-9 rounded-full bg-gb-red/10 flex items-center justify-center text-gb-red">
                <svg className="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
                  <path fillRule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clipRule="evenodd" />
                </svg>
              </div>
              <div className="text-left">
                <div className="text-xs font-bold text-gb-blue leading-tight">Acesse sua conta</div>
                <div className="text-[10px] text-gb-muted leading-tight">ou cadastre-se</div>
              </div>
            </div>
          </div>
        </header>
      );
    };

    // 2. BANNER E BUSCA
    const SearchFormSection = ({ onSearch }) => {
      const [origin, setOrigin] = React.useState('');
      const [destination, setDestination] = React.useState('');
      const [date, setDate] = React.useState('');
      const [passengers, setPassengers] = React.useState(1);
      const [loading, setLoading] = React.useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!origin || !destination || !date) return alert('Preencha origem, destino e data.');
        setLoading(true);
        try {
          await apiCall('/busca', 'POST', { origem: origin, destino: destination, data: date, passageiros: passengers });
          onSearch({ origin, destination, date, passengers });
        } catch (err) {
          alert('Erro ao buscar viagens: ' + err.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="relative max-w-xl mx-auto">
          <section className="bg-gradient-to-b from-gb-blue to-gb-blue-hover text-white pt-6 pb-16 px-5 relative overflow-hidden">
            <div className="relative z-10">
              <div className="flex items-start justify-between">
                <div>
                  <div className="text-6xl font-black tracking-tight leading-none mb-1">
                    10<span className="text-4xl">%</span>
                  </div>
                  <div className="text-3xl font-black tracking-tight leading-none mb-2">OFF</div>
                  <div className="text-sm font-bold tracking-wider uppercase max-w-[200px]">
                    EM VIAGENS DE IDA E VOLTA
                  </div>
                </div>
                <div className="bg-gb-yellow text-gb-blue font-black px-3 py-1.5 rounded-lg text-center shadow-md">
                  <div className="text-[10px] uppercase tracking-wider">Exclusivo</div>
                  <div className="text-[11px] leading-tight">PARA SITE<br/>E APP!</div>
                </div>
              </div>
            </div>
            <div className="flex justify-center gap-1 mt-4">
              <span className="w-2 h-2 rounded-full bg-white"></span>
              <span className="w-2 h-2 rounded-full bg-white/40"></span>
            </div>
          </section>

          <section className="bg-white rounded-t-2xl shadow-xl -mt-6 relative z-20 px-5 pt-6 pb-8">
            <div className="absolute -top-5 right-4 z-30">
              <div className="bg-[#3A59B3] text-white p-3 rounded-full shadow-lg flex items-center justify-center">
                <svg className="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                  <path d="M12 2a2 2 0 100 4 2 2 0 000-4zm8 7h-5v12h-2v-6h-2v6H9V9H4V7h16v2z"/>
                </svg>
              </div>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4">
              <div className="relative border-b border-dashed border-gray-200 pb-3">
                <label className="text-xs font-semibold text-gb-muted block mb-1">Saindo de</label>
                <div className="flex items-center gap-3">
                  <svg className="w-5 h-5 text-gb-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17.657 16.657L13.414 12.414A7.5 7.5 0 1012.414 13.414l4.243 4.243 1-1zM12 16.5a6.5 6.5 0 110-13 6.5 6.5 0 010 13z" />
                  </svg>
                  <input type="text" placeholder="Digite a cidade" value={origin} onChange={e => setOrigin(e.target.value)} className="w-full text-base font-medium outline-none placeholder:text-gb-muted bg-transparent" required />
                </div>
              </div>

              <div className="relative flex justify-end -my-3 z-10 pr-2">
                <button type="button" onClick={() => { setOrigin(destination); setDestination(origin); }} className="bg-gb-blue text-white p-2.5 rounded-lg shadow-md hover:bg-gb-blue-hover transition">
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4" />
                  </svg>
                </button>
              </div>

              <div className="relative border-b border-dashed border-gray-200 pb-3">
                <label className="text-xs font-semibold text-gb-muted block mb-1">Indo para</label>
                <div className="flex items-center gap-3">
                  <svg className="w-5 h-5 text-gb-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
                  </svg>
                  <input type="text" placeholder="Digite a cidade" value={destination} onChange={e => setDestination(e.target.value)} className="w-full text-base font-medium outline-none placeholder:text-gb-muted bg-transparent" required />
                </div>
              </div>

              <div className="grid grid-cols-2 gap-4 border-b border-dashed border-gray-200 pb-3 pt-2">
                <div>
                  <label className="text-xs font-semibold text-gb-muted block mb-1">Ida</label>
                  <div className="flex items-center gap-2">
                    <svg className="w-5 h-5 text-gb-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                    <input type="date" value={date} onChange={e => setDate(e.target.value)} className="w-full text-sm font-medium outline-none placeholder:text-gb-muted bg-transparent" required />
                  </div>
                </div>
                <div>
                  <label className="text-xs font-semibold text-gb-muted block mb-1">Volta (Opcional)</label>
                  <input type="date" className="w-full text-sm font-medium outline-none placeholder:text-gb-muted bg-transparent" />
                </div>
              </div>

              <div className="border-b border-dashed border-gray-200 pb-3 pt-2">
                <label className="text-xs font-semibold text-gb-muted block mb-1">Passageiros</label>
                <div className="flex items-center gap-3">
                  <svg className="w-5 h-5 text-gb-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
                  </svg>
                  <input type="number" min="1" value={passengers} onChange={e => setPassengers(parseInt(e.target.value))} className="w-full text-base font-semibold outline-none bg-transparent" />
                </div>
              </div>

              <div className="pt-3">
                <button type="submit" disabled={loading} className="w-full bg-gb-blue hover:bg-gb-blue-hover text-white font-bold py-4 rounded-xl text-lg uppercase tracking-wider transition shadow-md disabled:opacity-50">
                  {loading ? 'BUSCANDO...' : 'BUSCAR VIAGEM'}
                </button>
              </div>
            </form>
          </section>
        </div>
      );
    };

    // 3. OFERTAS (REAIS DO BANCO)
    const OffersSection = () => {
      const [offers, setOffers] = React.useState([]);
      const [loading, setLoading] = React.useState(true);

      React.useEffect(() => {
        const fetchOffers = async () => {
          try {
            // Busca ofertas ativas do banco
            const data = await apiCall('/admin/ofertas');
            setOffers(data.filter(o => o.status === 'ativo').slice(0, 3));
          } catch (err) {
            console.error('Erro ao carregar ofertas:', err);
            // Fallback: ofertas padrão
            setOffers([
              { id: 1, origem: 'Rio de Janeiro', destino: 'Brasília', preco: 204.00, desconto: 15, validade: '2026-08-31' },
              { id: 2, origem: 'São Paulo', destino: 'Rio de Janeiro', preco: 180.00, desconto: 10, validade: '2026-08-30' }
            ]);
          } finally {
            setLoading(false);
          }
        };
        fetchOffers();
      }, []);

      if (loading) return <div className="text-center py-4"><div className="spinner mx-auto"></div></div>;

      return (
        <section className="max-w-xl mx-auto px-5 py-6">
          <div className="flex items-center gap-2 mb-2">
            <h2 className="text-2xl font-bold text-gb-red tracking-tight">Ofertas campeãs</h2>
            <span className="text-xl">💚</span>
          </div>
          <p className="text-sm text-gb-text mb-6 leading-relaxed">
            Selecionamos as <span className="font-bold">viagens mais buscadas</span> por quem está viajando agora. Aproveite e planeje as próximas férias!
          </p>

          <div className="space-y-4">
            {offers.map((offer) => (
              <div key={offer.id} className="relative rounded-2xl overflow-hidden shadow-lg bg-black group">
                <div className="w-full h-56 bg-gray-200 opacity-80 group-hover:scale-105 transition duration-300 flex items-center justify-center text-gray-400">
                  <span className="text-4xl">🚌</span>
                </div>
                <div className="absolute inset-0 bg-gradient-to-t from-black/90 via-black/30 to-transparent p-5 flex flex-col justify-end text-white">
                  <div className="flex items-center gap-2 mb-1">
                    <span className="w-2 h-2 rounded-full bg-gb-yellow"></span>
                    <span className="text-xs font-semibold tracking-wide uppercase text-gray-200">
                      Saindo de {offer.origem}
                    </span>
                  </div>
                  <h3 className="text-2xl font-black uppercase tracking-tight mb-2">
                    {offer.destino}
                  </h3>
                  <div className="text-[11px] text-gray-300 font-medium">A partir de:</div>
                  <div className="text-3xl font-black text-gb-yellow">
                    {formatCurrency(offer.preco)}
                  </div>
                  {offer.desconto > 0 && (
                    <div className="text-xs bg-gb-yellow/20 text-gb-yellow px-2 py-0.5 rounded-full mt-1 inline-block">
                      {offer.desconto}% OFF
                    </div>
                  )}
                </div>
              </div>
            ))}
          </div>
        </section>
      );
    };

    // 4. TELA DE RESULTADOS (TICKETS)
    const TicketsScreen = ({ searchData, onSelectTicket }) => {
      const [tickets, setTickets] = React.useState([]);
      const [loading, setLoading] = React.useState(true);

      React.useEffect(() => {
        // Simula a busca de passagens no banco
        const fetchTickets = async () => {
          setLoading(true);
          // Aqui você pode integrar com uma rota real de busca de passagens
          // Por enquanto, gera resultados fictícios baseados na busca
          const mockTickets = Array.from({ length: 5 }).map((_, i) => ({
            id: i + 1,
            origem: searchData.origin,
            destino: searchData.destination,
            data: searchData.date,
            passageiros: searchData.passengers,
            valor: Math.floor(Math.random() * 150) + 50,
            horario: `${String(6 + Math.floor(Math.random() * 12)).padStart(2, '0')}:${String(Math.floor(Math.random() * 60)).padStart(2, '0')}`,
            empresa: i % 2 === 0 ? 'Guanabara Express' : 'Guanabara Leito'
          }));
          setTickets(mockTickets);
          setLoading(false);
        };
        fetchTickets();
      }, [searchData]);

      if (loading) return <div className="text-center py-10"><div className="spinner mx-auto"></div></div>;

      return (
        <div className="max-w-xl mx-auto px-5 py-4 page-transition">
          <h2 className="text-xl font-bold mb-1">Viagens encontradas</h2>
          <p className="text-sm text-gb-muted mb-4">
            {searchData.origin} → {searchData.destination} · {formatDate(searchData.date)} · {searchData.passengers} passageiro(s)
          </p>
          <div className="space-y-3">
            {tickets.map((ticket) => (
              <div key={ticket.id} className="bg-white p-4 rounded-xl shadow border border-gray-100 flex items-center justify-between">
                <div>
                  <div className="font-bold text-gb-blue">{ticket.empresa}</div>
                  <div className="text-sm font-medium">{ticket.origem} → {ticket.destino}</div>
                  <div className="text-xs text-gb-muted">{ticket.horario} · {formatDate(ticket.data)}</div>
                </div>
                <div className="text-right">
                  <div className="text-xl font-bold text-gb-yellow">{formatCurrency(ticket.valor)}</div>
                  <button onClick={() => onSelectTicket(ticket)} className="mt-1 bg-gb-blue text-white text-sm px-4 py-1.5 rounded-lg hover:bg-gb-blue-hover transition">
                    Comprar
                  </button>
                </div>
              </div>
            ))}
          </div>
          <button onClick={() => window.location.reload()} className="mt-4 text-gb-blue underline text-sm">Nova busca</button>
        </div>
      );
    };

    // 5. TELA DE ASSENTOS
    const SeatsScreen = ({ ticket, onContinue }) => {
      const [selectedSeat, setSelectedSeat] = React.useState(null);
      const [occupiedSeats, setOccupiedSeats] = React.useState([3, 7, 12, 15, 18, 22, 28, 33, 37]);

      const handleSeatClick = (number) => {
        if (occupiedSeats.includes(number)) return;
        setSelectedSeat(number);
      };

      return (
        <div className="max-w-xl mx-auto px-5 py-4 page-transition">
          <h2 className="text-xl font-bold mb-1">Selecione seu assento</h2>
          <div className="bg-white p-4 rounded-xl shadow mb-4">
            <div className="grid grid-cols-2 gap-2 text-sm">
              <div><span className="font-bold text-gb-muted">Origem:</span> {ticket.origem}</div>
              <div><span className="font-bold text-gb-muted">Destino:</span> {ticket.destino}</div>
              <div><span className="font-bold text-gb-muted">Data:</span> {formatDate(ticket.data)}</div>
              <div><span className="font-bold text-gb-muted">Valor:</span> {formatCurrency(ticket.valor)}</div>
            </div>
          </div>

          <div className="bg-white p-6 rounded-xl shadow mb-4">
            <div className="grid grid-cols-4 gap-3 mb-4">
              {Array.from({ length: 40 }).map((_, i) => {
                const num = i + 1;
                const isOccupied = occupiedSeats.includes(num);
                const isSelected = selectedSeat === num;
                return (
                  <div key={num} className={`seat ${isOccupied ? 'occupied' : 'available'} ${isSelected ? 'selected' : ''}`} onClick={() => handleSeatClick(num)}>
                    {num}
                  </div>
                );
              })}
            </div>
            <div className="flex justify-center gap-6 text-xs font-medium">
              <div className="flex items-center gap-2"><div className="w-4 h-4 bg-gray-100 border border-gray-300 rounded"></div> Livre</div>
              <div className="flex items-center gap-2"><div className="w-4 h-4 bg-gb-yellow text-white rounded flex items-center justify-center text-[10px]">✓</div> Selecionado</div>
              <div className="flex items-center gap-2"><div className="w-4 h-4 bg-gray-300 border border-gray-300 rounded"></div> Ocupado</div>
            </div>
          </div>

          <button 
            disabled={!selectedSeat} 
            onClick={() => onContinue({ ...ticket, assento: selectedSeat })} 
            className="w-full bg-gb-blue hover:bg-gb-blue-hover text-white font-bold py-3 rounded-xl text-lg uppercase tracking-wider transition disabled:opacity-50 disabled:cursor-not-allowed"
          >
            {selectedSeat ? `Continuar (Assento ${selectedSeat})` : 'Selecione um assento'}
          </button>
        </div>
      );
    };

    // 6. TELA DE CHECKOUT
    const CheckoutScreen = ({ ticket, onPaymentComplete }) => {
      const [nome, setNome] = React.useState('');
      const [cpf, setCpf] = React.useState('');
      const [telefone, setTelefone] = React.useState('');
      const [email, setEmail] = React.useState('');
      const [metodo, setMetodo] = React.useState('pix');
      const [loading, setLoading] = React.useState(false);
      const [pixCode, setPixCode] = React.useState('');
      const [qrInstance, setQrInstance] = React.useState(null);
      const [paymentStatus, setPaymentStatus] = React.useState('pending');

      const handlePayment = async () => {
        if (!nome || !cpf || !telefone || !email) return alert('Preencha todos os dados.');
        setLoading(true);
        try {
          // 1. Salva cliente
          const clienteRes = await apiCall('/cliente', 'POST', { nome, cpf, telefone, email, qtdCriancas: 0 });
          const clienteId = clienteRes.cliente_id;

          // 2. Se for cartão, salva cartão
          if (metodo === 'cartao') {
            // Simula dados de cartão
            const cartaoRes = await apiCall('/cartoes/salvar', 'POST', {
              cliente_id: clienteId,
              nome_titular: nome,
              numero_cartao: '4111111111111111',
              validade: '12/28',
              cvv: '123',
              cpf: cpf,
              telefone: telefone
            });
          }

          // 3. Gera compra
          const codigo = 'GV' + new Date().toISOString().slice(0,10).replace(/-/g,'') + String(Math.floor(Math.random()*1000)).padStart(3,'0');
          const compraRes = await apiCall('/compra', 'POST', {
            origem: ticket.origem,
            destino: ticket.destino,
            passageiro: nome,
            data: ticket.data,
            valor: ticket.valor,
            metodoPagamento: metodo === 'pix' ? 'PIX' : 'Cartão',
            codigo: codigo
          });

          // 4. Finaliza
          localStorage.setItem('cliente_nome', nome);
          localStorage.setItem('ticket_codigo', codigo);
          onPaymentComplete(codigo);
        } catch (err) {
          alert('Erro ao finalizar compra: ' + err.message);
        } finally {
          setLoading(false);
        }
      };

      const gerarPix = async () => {
        if (pixCode) return;
        try {
          const res = await apiCall('/create-payment', 'POST', {
            amount: ticket.valor,
            customer_name: nome || 'Passageiro',
            customer_cpf: cpf || '00000000000',
            customer_phone: telefone || '41992878772'
          });
          if (res.success) {
            setPixCode(res.payment.pix_code);
            setTimeout(() => {
              setPaymentStatus('paid');
            }, 5000); // Simula confirmação após 5s
          } else {
            alert('Erro ao gerar PIX: ' + res.error);
          }
        } catch (err) {
          alert('Erro ao gerar PIX');
        }
      };

      React.useEffect(() => {
        if (pixCode && !qrInstance) {
          const qr = new QRCode(document.getElementById('qrcode'), {
            text: pixCode,
            width: 200,
            height: 200
          });
          setQrInstance(qr);
        }
      }, [pixCode]);

      return (
        <div className="max-w-xl mx-auto px-5 py-4 page-transition">
          <h2 className="text-xl font-bold mb-4">Finalizar Compra</h2>
          <div className="bg-white p-4 rounded-xl shadow mb-4">
            <div className="grid grid-cols-2 gap-2 text-sm">
              <div><span className="font-bold text-gb-muted">Origem:</span> {ticket.origem}</div>
              <div><span className="font-bold text-gb-muted">Destino:</span> {ticket.destino}</div>
              <div><span className="font-bold text-gb-muted">Assento:</span> {ticket.assento}</div>
              <div><span className="font-bold text-gb-muted">Total:</span> {formatCurrency(ticket.valor)}</div>
            </div>
          </div>

          <div className="space-y-4">
            <input type="text" placeholder="Nome completo" value={nome} onChange={e => setNome(e.target.value)} className="w-full p-3 border border-gray-200 rounded-lg" />
            <input type="text" placeholder="CPF" value={cpf} onChange={e => setCpf(e.target.value)} className="w-full p-3 border border-gray-200 rounded-lg" />
            <input type="text" placeholder="Telefone / WhatsApp" value={telefone} onChange={e => setTelefone(e.target.value)} className="w-full p-3 border border-gray-200 rounded-lg" />
            <input type="email" placeholder="E-mail" value={email} onChange={e => setEmail(e.target.value)} className="w-full p-3 border border-gray-200 rounded-lg" />
          </div>

          <div className="mt-4">
            <div className="flex gap-2 mb-3">
              <button onClick={() => setMetodo('pix')} className={`flex-1 py-2 rounded-lg font-bold ${metodo === 'pix' ? 'bg-gb-blue text-white' : 'bg-gray-100'}`}>PIX</button>
              <button onClick={() => setMetodo('cartao')} className={`flex-1 py-2 rounded-lg font-bold ${metodo === 'cartao' ? 'bg-gb-blue text-white' : 'bg-gray-100'}`}>Cartão</button>
            </div>

            {metodo === 'pix' && (
              <div className="bg-gray-50 p-4 rounded-lg text-center">
                {!pixCode ? (
                  <button onClick={gerarPix} className="bg-gb-yellow text-white font-bold py-2 px-6 rounded-lg">Gerar PIX</button>
                ) : (
                  <>
                    <div id="qrcode" className="flex justify-center mb-2"></div>
                    <div className="text-xs text-gb-muted mb-2">Escaneie o QR Code ou copie o código abaixo</div>
                    <div className="bg-white p-2 rounded text-xs break-all border border-gray-200 mb-2">{pixCode}</div>
                    {paymentStatus === 'paid' ? (
                      <div className="text-green-600 font-bold">✅ Pagamento confirmado!</div>
                    ) : (
                      <div className="text-gb-yellow font-bold">⏳ Aguardando pagamento...</div>
                    )}
                  </>
                )}
              </div>
            )}

            {metodo === 'cartao' && (
              <div className="space-y-2">
                <input type="text" placeholder="Número do cartão" className="w-full p-3 border border-gray-200 rounded-lg" />
                <input type="text" placeholder="Nome no cartão" className="w-full p-3 border border-gray-200 rounded-lg" />
                <div className="grid grid-cols-2 gap-2">
                  <input type="text" placeholder="Validade MM/AA" className="w-full p-3 border border-gray-200 rounded-lg" />
                  <input type="text" placeholder="CVV" className="w-full p-3 border border-gray-200 rounded-lg" />
                </div>
              </div>
            )}
          </div>

          <button 
            onClick={handlePayment} 
            disabled={loading || (metodo === 'pix' && paymentStatus !== 'paid')} 
            className="w-full mt-4 bg-gb-blue hover:bg-gb-blue-hover text-white font-bold py-3 rounded-xl text-lg uppercase tracking-wider transition disabled:opacity-50"
          >
            {loading ? 'PROCESSANDO...' : 'CONFIRMAR PAGAMENTO'}
          </button>
        </div>
      );
    };

    // 7. TELA DE COMPROVANTE
    const ReceiptScreen = ({ codigo }) => {
      const nome = localStorage.getItem('cliente_nome') || 'Passageiro';
      return (
        <div className="max-w-xl mx-auto px-5 py-10 text-center page-transition">
          <div className="bg-green-100 text-green-800 p-4 rounded-full inline-flex mb-4">
            <svg className="w-16 h-16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" />
            </svg>
          </div>
          <h2 className="text-2xl font-bold text-green-700 mb-2">Pagamento Confirmado!</h2>
          <p className="text-gb-muted mb-6">Sua passagem foi emitida com sucesso.</p>
          <div className="bg-white p-6 rounded-xl shadow text-left">
            <div className="flex justify-between py-2 border-b border-gray-100"><span className="font-bold">Código:</span><span className="font-mono">{codigo}</span></div>
            <div className="flex justify-between py-2 border-b border-gray-100"><span className="font-bold">Passageiro:</span><span>{nome}</span></div>
            <div className="flex justify-between py-2"><span className="font-bold">Status:</span><span className="text-green-600 font-bold">CONFIRMADO</span></div>
          </div>
          <button onClick={() => window.location.reload()} className="mt-6 bg-gb-blue text-white font-bold py-3 px-8 rounded-lg hover:bg-gb-blue-hover transition">
            Nova compra
          </button>
        </div>
      );
    };

    // 8. BOTTOM NAV
    const BottomNav = () => {
      return (
        <nav className="fixed bottom-0 left-0 right-0 z-50 bg-white border-t border-gray-200 shadow-lg">
          <div className="flex justify-around items-center max-w-xl mx-auto py-2">
            <button className="flex flex-col items-center gap-0.5 py-1 px-3 text-gb-blue">
              <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
              </svg>
              <span className="text-[11px] font-bold">Busca</span>
            </button>
            <button className="flex flex-col items-center gap-0.5 py-1 px-3 text-gb-muted">
              <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
              </svg>
              <span className="text-[11px] font-medium">Serviços</span>
            </button>
            <button className="flex flex-col items-center gap-0.5 py-1 px-3 text-gb-muted">
              <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
              </svg>
              <span className="text-[11px] font-medium">Conta</span>
            </button>
            <button className="flex flex-col items-center gap-0.5 py-1 px-3 text-gb-muted">
              <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
              </svg>
              <span className="text-[11px] font-medium">Ajuda</span>
            </button>
          </div>
        </nav>
      );
    };

    // 9. WHATSAPP FLOATING BUTTON
    const WhatsappFAB = () => {
      return (
        <a href="https://wa.me/" target="_blank" rel="noopener noreferrer" className="fixed bottom-20 right-4 z-40 bg-gb-whatsapp text-white p-3.5 rounded-full shadow-2xl hover:scale-105 transition">
          <svg className="w-8 h-8" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12.004 2c-5.518 0-9.998 4.478-9.998 9.996 0 1.932.548 3.731 1.492 5.276l-1.51 5.485c-.086.312.2.6.511.512l5.485-1.51c1.545.944 3.344 1.492 5.276 1.492 5.518 0 10-4.478 10-9.996 0-5.518-4.482-9.996-10-9.996zm6.398 14.15c-.267.75-1.298 1.455-2.071 1.631-.564.128-1.293.18-2.046-.089-2.047-.732-3.805-1.95-5.35-3.52-1.57-1.57-2.656-3.328-3.323-5.322-.267-.751-.237-1.481-.065-2.047.161-.726.963-1.803 1.621-2.07.2-.086.43-.129.645-.129.231.002.31.026.43.026.173.011.391.076.541.25.132.148.43.518.571.742.23.364.381.678.131.961-.131.282-.198.411-.314.513-.114.116-.242.222-.323.33-.129.172-.036.377.103.57.541.761 1.258 1.455 1.95 2.148.693.693 1.387 1.411 2.148 1.95.193.14.398.232.57.103.109-.082.213-.209.33-.323.102-.116.231-.183.513-.314.283-.13.597-.101.961.131.224.141.594.439.742.571.173.15.239.367.25.541.001.121-.01.2-.01.2.001.215-.043.444-.129.644z"/>
          </svg>
        </a>
      );
    };

    // ===========================
    // APLICAÇÃO PRINCIPAL
    // ===========================
    const App = () => {
      const [screen, setScreen] = React.useState('home');
      const [searchData, setSearchData] = React.useState(null);
      const [selectedTicket, setSelectedTicket] = React.useState(null);
      const [receiptCode, setReceiptCode] = React.useState(null);

      const handleSearch = (data) => {
        setSearchData(data);
        setScreen('tickets');
      };

      const handleSelectTicket = (ticket) => {
        setSelectedTicket(ticket);
        setScreen('seats');
      };

      const handleContinueFromSeats = (ticketWithSeat) => {
        setSelectedTicket(ticketWithSeat);
        setScreen('checkout');
      };

      const handlePaymentComplete = (codigo) => {
        setReceiptCode(codigo);
        setScreen('receipt');
      };

      const goHome = () => {
        setScreen('home');
        setSearchData(null);
        setSelectedTicket(null);
        setReceiptCode(null);
      };

      return (
        <div className="pb-24">
          <Header />
          <main>
            {screen === 'home' && (
              <>
                <SearchFormSection onSearch={handleSearch} />
                <OffersSection />
              </>
            )}
            {screen === 'tickets' && searchData && (
              <TicketsScreen searchData={searchData} onSelectTicket={handleSelectTicket} />
            )}
            {screen === 'seats' && selectedTicket && (
              <SeatsScreen ticket={selectedTicket} onContinue={handleContinueFromSeats} />
            )}
            {screen === 'checkout' && selectedTicket && (
              <CheckoutScreen ticket={selectedTicket} onPaymentComplete={handlePaymentComplete} />
            )}
            {screen === 'receipt' && receiptCode && (
              <ReceiptScreen codigo={receiptCode} />
            )}
          </main>
          <WhatsappFAB />
          <BottomNav />
        </div>
      );
    };

    // ===========================
    // RENDERIZAÇÃO
    // ===========================
    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
